
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pupa Quiz Hub</title>
<style>
  :root{
    --navy:#000080;
    --primary:#6C63FE;
    --white:#ffffff;
    --text:#0f172a;
    --muted:#667085;
    --line:#E6E8F0;
    --soft:#F7F8FF;
    --soft-2:#EEF0FF;
    --ring:rgba(108,99,254,.18);
    --success-bg:#EEF7F0;
    --success-line:#B7E4C0;
    --success-text:#166534;
    --error-bg:#FEF2F2;
    --error-line:#FECACA;
    --error-text:#991B1B;
    --shadow:0 18px 40px rgba(15,23,42,.08);
    --shadow-card:0 10px 24px rgba(15,23,42,.08);
    --font:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }

  html,body{
    margin:0;
    padding:0;
    background:transparent;
    color:var(--text);
    font-family:var(--font);
    font-size:16px;
  }

  *{ box-sizing:border-box; }

  .pupa-wrap{
    max-width:980px;
    margin:0 auto;
    padding:18px;
  }

  .pupa-shell{
    background:linear-gradient(180deg,#ffffff 0%, #fbfbff 100%);
    border:1px solid var(--line);
    border-radius:30px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }

  .screen{ display:none; }
  .screen.active{ display:block; }

  .hub-head{
    padding:22px 22px 10px;
  }

  .brand-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }

  .brand-row img{
    height:22px;
    width:auto;
    display:block;
  }

  .hub-title{
    font-size:clamp(1.9rem, 4vw, 2.9rem);
    line-height:1.08;
    letter-spacing:-.04em;
    margin:0;
    max-width:24ch;
  }

  .hub-sub{
    margin:8px 0 0;
    color:var(--muted);
    line-height:1.55;
    max-width:52ch;
    font-size:15px;
  }

  .card-grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(0,1fr));
    gap:16px;
    padding:14px 22px 22px;
  }

  .hub-card{
    appearance:none;
    width:100%;
    padding:0;
    border:1px solid var(--line);
    background:#fff;
    border-radius:24px;
    overflow:hidden;
    box-shadow:var(--shadow-card);
    cursor:pointer;
    text-align:left;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    display:flex;
    flex-direction:column;
    min-height:390px;
  }

  .hub-card:hover,
  .hub-card:focus-visible{
    transform:translateY(-2px);
    box-shadow:0 16px 34px rgba(15,23,42,.12);
    border-color:#d8dcf0;
    outline:none;
  }

  .hub-card-media{
    position:relative;
    min-height:240px;
    flex:0 0 240px;
    overflow:hidden;
    background:#f3f5ff;
  }

  .hub-card-media img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    object-position:center;
  }

  .hub-card-media::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(15,23,42,.02) 0%, rgba(15,23,42,.18) 100%);
    pointer-events:none;
  }

  .hub-card-chip{
    position:absolute;
    top:14px;
    left:14px;
    z-index:1;
    display:inline-flex;
    align-items:center;
    padding:8px 12px;
    border-radius:999px;
    background:rgba(255,255,255,.88);
    color:var(--text);
    font-size:12px;
    font-weight:800;
    backdrop-filter:blur(8px);
    box-shadow:0 8px 18px rgba(15,23,42,.08);
  }

  .hub-card-body{
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:16px;
    flex:1 1 auto;
  }

  .hub-card-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }

  .hub-card-number,
  .hub-card-time{
    font-size:12px;
    line-height:1;
    font-weight:800;
    color:var(--muted);
  }

  .hub-card-copy{
    min-height:76px;
  }

  .hub-card-title{
    font-size:20px;
    line-height:1.1;
    letter-spacing:-.03em;
    font-weight:800;
    margin:0 0 6px;
    color:var(--text);
  }

  .hub-card-sub{
    margin:0;
    font-size:14px;
    line-height:1.5;
    color:var(--muted);
  }

  .hub-card-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:auto;
  }

  .hub-card-note{
    font-size:12px;
    line-height:1.4;
    color:var(--muted);
  }

  .hub-card-cta{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:42px;
    padding:0 16px;
    border-radius:999px;
    background:linear-gradient(135deg, var(--primary) 0%, var(--navy) 100%);
    color:#fff;
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
    box-shadow:0 12px 24px rgba(108,99,254,.18);
  }

  .progress-wrap{
    padding:18px 22px 0;
  }

  .progress{
    height:8px;
    background:#edf0fb;
    border-radius:999px;
    overflow:hidden;
  }

  .bar{
    height:100%;
    width:0;
    background:linear-gradient(135deg, var(--primary) 0%, var(--navy) 100%);
    transition:width .25s ease;
  }

  .flow-wrap{
    max-width:760px;
    margin:0 auto;
    padding:18px 22px 24px;
  }

  .flow-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }

  .back-btn{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--muted);
    font-weight:700;
    padding:0;
    cursor:pointer;
  }

  .pill{
    display:inline-flex;
    align-items:center;
    padding:8px 12px;
    border-radius:999px;
    background:var(--soft);
    color:var(--navy);
    font-size:12px;
    font-weight:700;
  }

  .quiz-hero{
    position:relative;
    width:100%;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:22px;
    background:#f5f7ff;
    margin:0 0 18px;
  }

  .quiz-hero::before{
    content:"";
    display:block;
    padding-top:46%;
  }

  .quiz-hero img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .quiz-hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(15,23,42,.08) 0%, rgba(15,23,42,.24) 100%);
    pointer-events:none;
  }

  .landing-main-title{
    font-size:clamp(2rem, 4.4vw, 3.2rem);
    line-height:1.08;
    letter-spacing:-.04em;
    margin:0 0 18px;
    max-width:30ch;
  }

  .panel h2{
    font-size:clamp(1.9rem, 4vw, 2.9rem);
    line-height:1.03;
    letter-spacing:-.04em;
    margin:0;
    max-width:16ch;
  }

  .panel p{
    margin:10px 0 0;
    color:var(--muted);
    line-height:1.6;
    font-size:15px;
    max-width:60ch;
  }

  .field{
    width:100%;
    min-height:50px;
    padding:14px 16px;
    border:1px solid var(--line);
    border-radius:16px;
    font-size:16px;
    color:var(--text);
    background:#fff;
    outline:none;
    transition:border-color .18s ease, box-shadow .18s ease;
  }

  .field:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 4px var(--ring);
  }

  .inline-row{
    display:flex;
    gap:12px;
    margin-top:18px;
    align-items:center;
  }

  .grow{ flex:1; }

  .btn{
    appearance:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:50px;
    padding:14px 18px;
    border-radius:14px;
    border:1px solid transparent;
    font-weight:800;
    cursor:pointer;
    transition:.18s ease;
    text-align:center;
    white-space:nowrap;
    text-decoration:none;
  }

  .btn.primary{
    background:linear-gradient(135deg, var(--primary) 0%, var(--navy) 100%);
    color:#fff;
    box-shadow:0 12px 24px rgba(108,99,254,.22);
  }

  .btn.primary:hover{ filter:brightness(1.03); }
  .btn.primary:active{ transform:translateY(1px); }

  .btn.secondary{
    background:#fff;
    border-color:var(--line);
    color:var(--text);
  }

  .btn.secondary:hover{ background:var(--soft); }

  .btn:disabled{
    opacity:.55;
    cursor:not-allowed;
  }

  .choices{
    display:grid;
    gap:12px;
    margin-top:18px;
  }

  .option{
    display:flex;
    gap:12px;
    align-items:flex-start;
    padding:16px;
    border:1.5px solid var(--line);
    border-radius:18px;
    background:#fff;
    cursor:pointer;
    transition:.18s ease;
  }

  .option:hover{
    border-color:#cfd5ea;
    background:#fcfcff;
  }

  .option.selected{
    border-color:var(--primary);
    background:var(--soft);
  }

  .bullet{
    width:18px;
    height:18px;
    border:1.8px solid #cfd5ea;
    border-radius:50%;
    margin-top:2px;
    flex:0 0 auto;
    position:relative;
    background:#fff;
  }

  .option.selected .bullet{
    border-color:var(--primary);
  }

  .option.selected .bullet::after{
    content:"";
    position:absolute;
    inset:4px;
    border-radius:50%;
    background:var(--primary);
  }

  .option-copy{
    font-size:15px;
    font-weight:700;
    line-height:1.45;
  }

  .question-actions{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:16px;
    align-items:center;
  }

  .consent{
    display:flex;
    gap:10px;
    align-items:flex-start;
    margin-top:12px;
    color:var(--muted);
    font-size:14px;
    line-height:1.55;
  }

  .consent input{ margin-top:3px; }

  .msg{
    margin-top:12px;
    min-height:18px;
    font-size:14px;
  }

  .success{
    background:var(--success-bg);
    border:1px solid var(--success-line);
    color:var(--success-text);
    padding:12px 14px;
    border-radius:12px;
  }

  .error{
    background:var(--error-bg);
    border:1px solid var(--error-line);
    color:var(--error-text);
    padding:12px 14px;
    border-radius:12px;
  }

  .muted{ color:var(--muted); }

  .result-title{
    font-size:clamp(2rem, 4vw, 2.9rem);
    font-weight:800;
    line-height:1.06;
    letter-spacing:-.04em;
    margin:12px 0 6px;
  }

  .result-block{
    background:#fff;
    border:1px solid var(--line);
    border-left:4px solid var(--primary);
    padding:14px 16px;
    border-radius:14px;
    margin:12px 0;
    line-height:1.6;
    color:var(--text);
  }

  .result-block strong{ color:#0b1732; }

  .followup-card{
    background:var(--soft);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px;
    margin-top:18px;
  }

  .followup-card h3{
    margin:0;
    font-size:1.2rem;
    line-height:1.3;
    letter-spacing:-.02em;
  }

  .followup-card p{
    margin:8px 0 0;
    font-size:14px;
  }

  .choice-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:14px;
  }

  .choice-chip{
    appearance:none;
    border:1px solid var(--line);
    background:#fff;
    color:var(--text);
    border-radius:999px;
    padding:12px 16px;
    font-weight:800;
    cursor:pointer;
    transition:.18s ease;
  }

  .choice-chip:hover,
  .choice-chip.active{
    border-color:var(--primary);
    background:#fff;
    box-shadow:0 0 0 4px var(--ring);
  }

  .dual-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:16px;
  }

  .tiny-note{
    margin-top:10px;
    font-size:13px;
    color:var(--muted);
  }

  .hidden{ display:none !important; }

  @media (max-width:720px){
    .pupa-wrap{
      padding:12px;
    }

    .card-grid{
      grid-template-columns:1fr;
      padding:12px 16px 18px;
    }

    .hub-head,
    .progress-wrap,
    .flow-wrap{
      padding-left:16px;
      padding-right:16px;
    }

    .inline-row,
    .question-actions,
    .hub-card-foot,
    .dual-actions{
      flex-direction:column;
      align-items:stretch;
    }

    .btn,
    .hub-card-cta,
    .choice-chip{
      width:100%;
      justify-content:center;
    }

    .hub-card{
      min-height:unset;
    }

    .hub-card-media{
      min-height:260px;
      flex-basis:260px;
    }

    .hub-card-copy{
      min-height:auto;
    }

    .hub-title,
    .panel h2,
    .result-title{
      max-width:none;
    }

    .quiz-hero::before{
      padding-top:58%;
    }
  }
</style>
</head>
<body>
<div class="pupa-wrap">
  <div class="pupa-shell">

    <section id="screen-hub" class="screen" aria-label="Pupa quiz hub">

          </form>

          <iframe id="mc_iframe" name="mc_iframe" class="hidden"></iframe>
          <form id="mcFallbackForm" class="hidden"

            <input type="email" name="EMAIL" id="fb_EMAIL" value="">
            <input type="text" name="FNAME" id="fb_FNAME" value="">

            <input type="text" name="b_44c6260e44554e7b992e09185_083452c971" id="fb_hp" value="">
          </form>
        </section>

        <section id="screen-result" class="panel hidden" aria-live="polite">
          <div id="resultContainer"></div>
          <div id="resultActionArea"></div>
          <div class="inline-row">
            <div class="grow"></div>
            <button id="restartBtn" class="btn secondary" type="button">Restart</button>
          </div>
        </section>
      </div>
    </section>
  </div>
</div>

        nextBtn.disabled = true;
        autoTimer = setTimeout(function() {
          autoAdvanceOrFinish();
          autoTimer = null;
        }, 180);
      });
    });
  }

  function autoAdvanceOrFinish() {
    const total = currentQuiz.questions.length;
    if(currentQuestionIndex < total - 1) {
      currentQuestionIndex += 1;
      loadQuestion(currentQuestionIndex);
    } else {
      finishQuestionFlow();
    }
  }

  function finishQuestionFlow() {
    hideFlowPanels();
    if(journey.email && journey.consent) {
      progressBar.style.width = '100%';
      showResult();
      return;
    }
    screenEmail.classList.remove('hidden');
    progressBar.style.width = '100%';
  }

  function getAnswerText(questionIndex, answerKey) {
    const question = currentQuiz.questions[questionIndex];
    if(!question || !answerKey) return '';
    return question.options[answerKey] || '';
  }

  function buildHybridKey(ids) {
    const order = currentQuiz.resultOrder || [];
    return ids.slice().sort(function(a, b) { return order.indexOf(a) - order.indexOf(b); }).join('|');
  }

  function computeResult() {
    if(lastComputedResult) return lastComputedResult;
    const counts = {};
    Object.keys(currentQuiz.results).forEach(function(resultId) { counts[resultId] = 0; });
    answers.forEach(function(letter) {
      const resultId = currentQuiz.letterToResult[letter];
      if(resultId && Object.prototype.hasOwnProperty.call(counts, resultId)) {
        counts[resultId] += 1;
      }
    });
    const max = Math.max.apply(null, Object.keys(counts).map(function(key) { return counts[key]; }));
    const winners = currentQuiz.resultOrder.filter(function(resultId) { return counts[resultId] === max; });
    const single = winners.length === 1;
    const primaryId = winners[0];
    const hybridLabel = single ? '' : (currentQuiz.hybridLabels[buildHybridKey(winners)] || 'Hybrid Match');
    lastComputedResult = {
      counts: counts,
      winners: winners,
      single: single,
      primaryId: primaryId,
      primary: currentQuiz.results[primaryId],
      hybridLabel: hybridLabel,
      title: single ? currentQuiz.results[primaryId].title : hybridLabel,
      resultKey: single ? primaryId : winners.join('+')
    };
    return lastComputedResult;
  }

  function getMailchimpTagForResult(resultInfo) {
    const tags = currentQuiz.mailchimpTags || {};
    if(resultInfo.single) {
      return tags[resultInfo.primaryId] || '';
    }
    return '';
  }

  function getSingleResultHeadline(name, resultInfo) {
    const safeName = escapeHTML(name || 'Friend');
    if(currentQuiz.kind === 'animal') {
      return safeName + ", you're the " + escapeHTML(resultInfo.primary.title) + '.';
    }
    return safeName + ', your team energy is ' + escapeHTML(resultInfo.primary.title) + '.';
  }

  function getHybridHeadline(name, resultInfo) {
    const safeName = escapeHTML(name || 'Friend');
    if(currentQuiz.kind === 'animal') {
      return safeName + ", you're a rare hybrid: " + escapeHTML(resultInfo.hybridLabel || 'Hybrid Match') + '.';
    }
    return safeName + ', your team energy is a powerful blend: ' + escapeHTML(resultInfo.hybridLabel || 'Hybrid Match') + '.';
  }

  function renderProfileCard(profile) {
    let html = '';
    html += '<div class="result-block"><strong>' + escapeHTML(profile.emoji + ' ' + profile.title) + '</strong><br>' + escapeHTML(profile.description) + '</div>';
    html += '<div class="result-block"><strong>' + escapeHTML(profile.superpowerLabel) + ':</strong><br>' + escapeHTML(profile.superpowerText) + '</div>';
    if(profile.worksBestText) {
      html += '<div class="result-block"><strong>' + escapeHTML(profile.worksBestLabel) + ':</strong><br>' + escapeHTML(profile.worksBestText) + '</div>';
    }
    html += '<div class="result-block"><strong>' + escapeHTML(profile.levelUpLabel) + ':</strong><br>' + escapeHTML(profile.levelUpText) + '</div>';
    return html;
  }

  function buildAnswerPayload() {
    const payload = { answers_json: JSON.stringify(answers) };
    answers.forEach(function(answerKey, index) {
      payload['answer_' + (index + 1) + '_key'] = answerKey || '';
      payload['answer_' + (index + 1) + '_text'] = getAnswerText(index, answerKey);
    });
    return payload;
  }

  function buildBasePayload(extra) {
    const canUseResult = !!lastComputedResult || (answers.length > 0 && answers.every(function(answer) { return !!answer; }));
    const resultInfo = canUseResult ? computeResult() : null;
    const payload = {
      session_id: journey.sessionId,
      flow_stage: screenResult.classList.contains('hidden') ? 'in_progress' : 'result',
      quiz_id: currentQuiz ? currentQuiz.id : '',
      quiz_title: currentQuiz ? currentQuiz.title : '',
      quiz_number: currentQuiz ? currentQuiz.number : '',
      result_key: resultInfo ? resultInfo.resultKey : '',
      result_label: resultInfo ? resultInfo.title : '',
      tied_result_keys: resultInfo && !resultInfo.single ? resultInfo.winners.join('|') : '',
      journey_quiz_order: journey.quizOrder.join(' > '),
      prompt_target_quiz_id: currentQuiz ? getOtherQuizId(currentQuiz.id) : '',
      recommend_to_friends: journey.recommendation || '',
      email: journey.email || '',
      first_name: journey.firstName || '',
      consent: journey.consent ? 'Yes' : 'No',
      page_url: window.location.href,
      referrer: document.referrer || '',
      user_agent: navigator.userAgent || ''
    };
    return Object.assign(payload, extra || {});
  }

  function markQuizCompleted() {
    if(!currentQuiz || completionLoggedForQuizId === currentQuiz.id) return;
    const resultInfo = computeResult();
    completionLoggedForQuizId = currentQuiz.id;
    if(journey.completedQuizIds.indexOf(currentQuiz.id) === -1) {
      journey.completedQuizIds.push(currentQuiz.id);
    }
    logEvent('quiz_completed', Object.assign(buildBasePayload({ flow_stage: 'completed' }), buildAnswerPayload(), {
      result_key: resultInfo.resultKey,
      result_label: resultInfo.title,
      tied_result_keys: resultInfo.single ? '' : resultInfo.winners.join('|')
    }));
  }

  function showResult() {
    const resultInfo = computeResult();
    hideFlowPanels();
    screenResult.classList.remove('hidden');

    let html = '<div class="pill">Your Result</div>';
    html += '<div class="result-title">' + (resultInfo.single ? getSingleResultHeadline(journey.firstName, resultInfo) : getHybridHeadline(journey.firstName, resultInfo)) + '</div>';

    if(resultInfo.single) {
      html += renderProfileCard(resultInfo.primary);
    } else {
      resultInfo.winners.forEach(function(resultId) {
        html += renderProfileCard(currentQuiz.results[resultId]);
      });
    }

    resultContainer.innerHTML = html;
    markQuizCompleted();
    renderResultActions();
  }

  function renderTransitionPrompt() {
    const otherQuizId = getOtherQuizId(currentQuiz.id);
    resultActionArea.innerHTML = '' +
      '<div class="followup-card">' +
        '<h3>' + escapeHTML(currentQuiz.resultPromptTitle) + '</h3>' +
        '<div class="dual-actions">' +
          '<button id="takeOtherQuizBtn" class="btn primary" type="button">' + escapeHTML(currentQuiz.resultPromptButton) + '</button>' +
          '<button id="skipOtherQuizBtn" class="btn secondary" type="button">' + escapeHTML(currentQuiz.secondaryPromptButton || 'Maybe later') + '</button>' +
        '</div>' +
      '</div>';

    $('#takeOtherQuizBtn', resultActionArea).addEventListener('click', function() {
      logEvent('next_quiz_clicked', buildBasePayload({ note: 'User accepted cross-quiz prompt', prompt_target_quiz_id: otherQuizId }));
      openQuiz(otherQuizId);
    });

    $('#skipOtherQuizBtn', resultActionArea).addEventListener('click', function() {
      logEvent('next_quiz_skipped', buildBasePayload({ note: 'User skipped cross-quiz prompt', prompt_target_quiz_id: otherQuizId }));
      renderExitPrompt();
    });
  }

  function renderExitPrompt() {
    const recommendationChosen = !!journey.recommendation;
    resultActionArea.innerHTML = '' +
      '<div class="followup-card">' +
        '<h3>Would you recommend this quiz to your friends?</h3>' +
        '<div class="choice-buttons">' +
          '<button class="choice-chip' + (journey.recommendation === 'Yes' ? ' active' : '') + '" type="button" data-recommend="Yes">Yes</button>' +
          '<button class="choice-chip' + (journey.recommendation === 'Maybe' ? ' active' : '') + '" type="button" data-recommend="Maybe">Maybe</button>' +
          '<button class="choice-chip' + (journey.recommendation === 'No' ? ' active' : '') + '" type="button" data-recommend="No">No</button>' +
        '</div>' +
      '</div>' +
      '<div class="followup-card ' + (recommendationChosen ? '' : 'hidden') + '" id="websitePromptCard">' +
        '<h3>Would you like to know your potential?</h3>' +
        '<div class="dual-actions">' +
          '<a id="goToPupaBtn" class="btn primary" href="' + escapeHTML(PUPA_WEBSITE_QUIZ_URL) + '" target="_blank" rel="noopener noreferrer">Yes, take me to Pupa</a>' +
          '<button id="stayHereBtn" class="btn secondary" type="button">Maybe later</button>' +
        '</div>' +
      '</div>';

    $$('[data-recommend]', resultActionArea).forEach(function(btn) {
      btn.addEventListener('click', function() {
        journey.recommendation = btn.getAttribute('data-recommend');
        logEvent('exit_feedback', buildBasePayload({ recommend_to_friends: journey.recommendation, note: 'Referral answer captured' }));
        renderExitPrompt();
      });
    });

    const websiteBtn = $('#goToPupaBtn', resultActionArea);
    if(websiteBtn) {
      websiteBtn.addEventListener('click', function() {
        journey.websiteClicked = true;
        logEvent('website_click', buildBasePayload({ note: 'User clicked through to Pupa website' }));
      });
    }

    const stayBtn = $('#stayHereBtn', resultActionArea);
    if(stayBtn) {
      stayBtn.addEventListener('click', function() {
        logEvent('website_declined', buildBasePayload({ note: 'User declined website click for now' }));
      });
    }
  }

  function renderResultActions() {
    const otherQuizId = getOtherQuizId(currentQuiz.id);
    const shouldOfferOtherQuiz = otherQuizId && journey.completedQuizIds.indexOf(otherQuizId) === -1;
    if(shouldOfferOtherQuiz) {
      renderTransitionPrompt();
      return;
    }
    renderExitPrompt();
  }

  function flattenPayload(payload) {
    const output = {};
    Object.keys(payload || {}).forEach(function(key) {
      const value = payload[key];
      if(value === undefined || value === null) {
        output[key] = '';
      } else if(typeof value === 'object') {
        output[key] = JSON.stringify(value);
      } else {
        output[key] = String(value);
      }
    });
    return output;
  }

  function sheetsEnabled() {
    return !!GOOGLE_SHEETS_WEB_APP_URL && GOOGLE_SHEETS_WEB_APP_URL.indexOf('PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') === -1;
  }

  function sendViaHiddenForm(url, params) {
    const iframeName = 'sheet_log_iframe';
    let iframe = document.getElementById(iframeName);
    if(!iframe) {
      iframe = document.createElement('iframe');
      iframe.id = iframeName;
      iframe.name = iframeName;
      iframe.className = 'hidden';
      document.body.appendChild(iframe);
    }
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = url;
    form.target = iframeName;
    form.className = 'hidden';
    Object.keys(params).forEach(function(key) {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = key;
      input.value = params[key];
      form.appendChild(input);
    });
    document.body.appendChild(form);
    form.submit();
    setTimeout(function() {
      try { form.remove(); } catch (e) {}
    }, 1500);
  }

  function logEvent(eventType, payload) {
    if(!sheetsEnabled()) return;
    const params = flattenPayload(Object.assign({
      event_type: eventType,
      timestamp_iso_client: new Date().toISOString()
    }, payload || {}));

    try {
      fetch(GOOGLE_SHEETS_WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: new URLSearchParams(params)
      }).catch(function() {
        sendViaHiddenForm(GOOGLE_SHEETS_WEB_APP_URL, params);
      });
    } catch (e) {
      sendViaHiddenForm(GOOGLE_SHEETS_WEB_APP_URL, params);
    }
  }

  function submitMailchimpJSONP(params, timeoutMs) {
    return new Promise(function(resolve, reject) {
      const callbackName = 'mc_cb_' + Math.random().toString(36).slice(2);
      let timedOut = false;
      window[callbackName] = function(response) {
        if(timedOut) return;
        cleanup();
        resolve(response);
      };

      const url = MAILCHIMP_POST_JSON_URL + '&' + new URLSearchParams(params).toString() + '&c=' + callbackName;
      const script = document.createElement('script');
      script.src = url;
      script.async = true;
      script.onerror = function() {
        cleanup();
        reject(new Error('Network error'));
      };
      document.body.appendChild(script);

      const timer = setTimeout(function() {
        timedOut = true;
        cleanup();
        reject(new Error('Timeout'));
      }, timeoutMs || 12000);

      function cleanup() {
        try { delete window[callbackName]; } catch (e) {}
        try { script.remove(); } catch (e) {}
        clearTimeout(timer);
      }
    });
  }

  nextBtn.addEventListener('click', function() {
    const selected = answers[currentQuestionIndex];
    if(!selected) return;
    autoAdvanceOrFinish();
  });

  prevBtn.addEventListener('click', function() {
    if(autoTimer) {
      clearTimeout(autoTimer);
      autoTimer = null;
    }
    if(currentQuestionIndex === 0) {
      renderIntro();
      return;
    }
    currentQuestionIndex -= 1;
    loadQuestion(currentQuestionIndex);
  });

  $('#mcForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    mcMsg.className = 'msg muted';
    mcMsg.textContent = '';

    if((hpInput.value || '').trim() !== '') {
      showResult();
      return;
    }

    const email = (emailInput.value || '').trim();
    if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      mcMsg.className = 'msg error';
      mcMsg.textContent = 'Please enter a valid email address.';
      return;
    }

    if(!consent.checked) {
      mcMsg.className = 'msg error';
      mcMsg.textContent = 'Please tick the consent box to continue.';
      return;
    }

    journey.email = email;
    journey.consent = true;
    journey.firstName = journey.firstName || (mcFname.value || '').trim();

    seeResultsBtn.setAttribute('disabled', 'true');
    mcMsg.textContent = 'Saving...';

    const resultInfo = computeResult();
    const tagId = getMailchimpTagForResult(resultInfo);
    const params = {
      EMAIL: journey.email,
      FNAME: journey.firstName,
      tags: tagId,
      b_44c6260e44554e7b992e09185_083452c971: ''
    };

    try {
      const response = await submitMailchimpJSONP(params, 12000);
      journey.hasSubmittedMailchimp = true;
      if(response && response.result === 'success') {
        mcMsg.className = 'msg success';
        mcMsg.textContent = 'Success! Check your inbox in a few minutes.';
      } else {
        mcMsg.className = 'msg success';
        mcMsg.textContent = 'You may already be subscribed. Showing your result now.';
      }
      logEvent('email_captured', Object.assign(buildBasePayload({ note: 'Email captured at gate' }), { email: journey.email, consent: 'Yes' }));
      showResult();
    } catch (err) {
      try {
        fbEmail.value = journey.email;
        fbFname.value = journey.firstName;
        fbTags.value = tagId;
        fbHp.value = '';
        fbForm.submit();
      } catch (_err) {}
      journey.hasSubmittedMailchimp = true;
      logEvent('email_captured', Object.assign(buildBasePayload({ note: 'Email captured via fallback path' }), { email: journey.email, consent: 'Yes' }));
      mcMsg.className = 'msg muted';
      mcMsg.textContent = 'Connection was spotty - proceeding anyway.';
      setTimeout(function() { showResult(); }, 900);
    } finally {
      seeResultsBtn.removeAttribute('disabled');
    }
  });

  $('#restartBtn').addEventListener('click', function() {
    if(autoTimer) {
      clearTimeout(autoTimer);
      autoTimer = null;
    }
    currentQuiz = null;
    journey.firstName = '';
    journey.email = '';
    journey.consent = false;
    journey.completedQuizIds = [];
    journey.recommendation = '';
    journey.websiteClicked = false;
    journey.hasSubmittedMailchimp = false;
    journey.quizOrder = [];
    emailInput.value = '';
    consent.checked = false;
    mcFname.value = '';
    mcMsg.textContent = '';
    resultContainer.innerHTML = '';
    resultActionArea.innerHTML = '';
    resetQuizState();
    showHub();
  });

  $('#backToHubBtn').addEventListener('click', function() {
    if(autoTimer) {
      clearTimeout(autoTimer);
      autoTimer = null;
    }
    showHub();
  });

  openQuiz(ENTRY_QUIZ_ID);
})();
</script>
</body>
</html>
