
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pupa Quiz Funnel</title>
<style>
  :root{
    --navy:#000080;
    --primary:#6C63FE;
    --white:#ffffff;
    --text:#0f172a;
    --muted:#667085;
    --line:#E6E8F0;
    --soft:#F7F8FF;
    --soft-2:#EEF0FF;
    --ring:rgba(108,99,254,.18);
    --success-bg:#EEF7F0;
    --success-line:#B7E4C0;
    --success-text:#166534;
    --error-bg:#FEF2F2;
    --error-line:#FECACA;
    --error-text:#991B1B;
    --shadow:0 18px 40px rgba(15,23,42,.08);
    --shadow-card:0 10px 24px rgba(15,23,42,.08);
    --font:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }

  html,body{
    margin:0;
    padding:0;
    background:transparent;
    color:var(--text);
    font-family:var(--font);
    font-size:16px;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  *{ box-sizing:border-box; }

  body{
    min-height:100vh;
  }

  .pupa-wrap{
    max-width:880px;
    margin:0 auto;
    padding:18px;
  }

  .pupa-shell{
    background:linear-gradient(180deg,#ffffff 0%, #fbfbff 100%);
    border:1px solid var(--line);
    border-radius:30px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }

  .screen{ display:none; }
  .screen.active{ display:block; }
  .hidden{ display:none !important; }

  .progress-wrap{
    padding:18px 22px 0;
  }

  .progress{
    height:8px;
    background:#edf0fb;
    border-radius:999px;
    overflow:hidden;
  }

  .bar{
    height:100%;
    width:0;
    background:linear-gradient(135deg, var(--primary) 0%, var(--navy) 100%);
    transition:width .25s ease;
  }

  .flow-wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 22px 28px;
  }

  .brand-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }

  .brand-row img{
    height:22px;
    width:auto;
    display:block;
  }

  .quiz-hero{
    position:relative;
    width:100%;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:22px;
    background:#f5f7ff;
    margin:0 0 18px;
  }

  .quiz-hero::before{
    content:"";
    display:block;
    padding-top:50%;
  }

  .quiz-hero img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .quiz-hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(15,23,42,.06) 0%, rgba(15,23,42,.24) 100%);
    pointer-events:none;
  }

  .landing-main-title,
  .panel h1,
  .panel h2,
  .result-title,
  .cta-title{
    font-size:clamp(2rem, 4.2vw, 3rem);
    line-height:1.05;
    letter-spacing:-.04em;
    margin:0;
    max-width:18ch;
  }

  .panel p,
  .result-sub,
  .cta-sub{
    margin:10px 0 0;
    color:var(--muted);
    line-height:1.6;
    font-size:15px;
    max-width:56ch;
  }

  .pill{
    display:inline-flex;
    align-items:center;
    padding:8px 12px;
    border-radius:999px;
    background:var(--soft);
    color:var(--navy);
    font-size:12px;
    font-weight:800;
    margin-bottom:12px;
  }

  .intro-stack,
  .result-stack{
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .intro-copy{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .field{
    width:100%;
    min-height:52px;
    padding:14px 16px;
    border:1px solid var(--line);
    border-radius:16px;
    font-size:16px;
    color:var(--text);
    background:#fff;
    outline:none;
    transition:border-color .18s ease, box-shadow .18s ease;
  }

  .field:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 4px var(--ring);
  }

  .inline-row{
    display:flex;
    gap:12px;
    align-items:center;
    margin-top:8px;
  }

  .grow{ flex:1; }

  .btn{
    appearance:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:52px;
    padding:14px 18px;
    border-radius:14px;
    border:1px solid transparent;
    font-weight:800;
    cursor:pointer;
    transition:.18s ease;
    text-align:center;
    white-space:nowrap;
    text-decoration:none;
    font-size:15px;
  }

  .btn.primary{
    background:linear-gradient(135deg, var(--primary) 0%, var(--navy) 100%);
    color:#fff;
    box-shadow:0 12px 24px rgba(108,99,254,.22);
  }

  .btn.primary:hover{ filter:brightness(1.03); }
  .btn.primary:active{ transform:translateY(1px); }

  .btn.secondary{
    background:#fff;
    border-color:var(--line);
    color:var(--text);
  }

  .btn.secondary:hover{ background:var(--soft); }

  .btn.ghost{
    background:transparent;
    color:var(--muted);
    border-color:transparent;
    box-shadow:none;
  }

  .btn:disabled{
    opacity:.55;
    cursor:not-allowed;
  }

  .question-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:12px;
  }

  .back-btn{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--muted);
    font-weight:700;
    padding:0;
    cursor:pointer;
  }

  .q-title{
    font-size:clamp(1.8rem, 4vw, 2.6rem);
    line-height:1.08;
    letter-spacing:-.04em;
    margin:8px 0 0;
    max-width:16ch;
  }

  .question-media,
  .result-media{
    position:relative;
    width:100%;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:20px;
    background:#f5f7ff;
  }

  .question-media{
    margin-top:16px;
  }

  .result-media{
    margin:14px 0 0;
  }

  .question-media::before,
  .result-media::before{
    content:"";
    display:block;
    padding-top:58%;
  }

  .question-media img,
  .result-media img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .choices{
    display:grid;
    gap:12px;
    margin-top:18px;
  }

  .option{
    display:flex;
    gap:12px;
    align-items:center;
    padding:16px;
    border:1.5px solid var(--line);
    border-radius:18px;
    background:#fff;
    cursor:pointer;
    transition:.18s ease;
    text-align:left;
  }

  .option:hover,
  .option:focus-visible{
    border-color:#cfd5ea;
    background:#fcfcff;
    outline:none;
  }

  .option.selected{
    border-color:var(--primary);
    background:var(--soft);
  }

  .bullet{
    width:18px;
    height:18px;
    border:1.8px solid #cfd5ea;
    border-radius:50%;
    flex:0 0 auto;
    position:relative;
    background:#fff;
  }

  .option.selected .bullet{
    border-color:var(--primary);
  }

  .option.selected .bullet::after{
    content:"";
    position:absolute;
    inset:4px;
    border-radius:50%;
    background:var(--primary);
  }

  .option-copy{
    font-size:16px;
    font-weight:800;
    line-height:1.35;
  }

  .question-actions{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:16px;
    align-items:center;
  }

  .email-card,
  .result-card,
  .cta-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:22px;
    padding:18px;
    box-shadow:var(--shadow-card);
  }

  #resultActionArea{
    margin-top:18px;
  }

  .email-eyebrow,
  .result-eyebrow,
  .cta-eyebrow{
    font-size:12px;
    font-weight:800;
    color:var(--navy);
    text-transform:uppercase;
    letter-spacing:.08em;
    margin-bottom:10px;
  }

  .consent{
    display:flex;
    gap:10px;
    align-items:flex-start;
    margin-top:12px;
    color:var(--muted);
    font-size:14px;
    line-height:1.55;
  }

  .consent input{ margin-top:3px; }

  .msg{
    margin-top:12px;
    min-height:18px;
    font-size:14px;
  }

  .success{
    background:var(--success-bg);
    border:1px solid var(--success-line);
    color:var(--success-text);
    padding:12px 14px;
    border-radius:12px;
  }

  .error{
    background:var(--error-bg);
    border:1px solid var(--error-line);
    color:var(--error-text);
    padding:12px 14px;
    border-radius:12px;
  }

  .muted{ color:var(--muted); }

  .result-sub{
    margin-top:8px;
  }

  .result-lines{
    display:grid;
    gap:10px;
    margin-top:18px;
  }

  .result-line{
    padding:14px 16px;
    border:1px solid var(--line);
    border-radius:16px;
    background:#fff;
    font-size:16px;
    font-weight:700;
    line-height:1.45;
  }

  .result-line.emphasis{
    background:var(--soft);
    border-color:#d9ddfb;
  }

  .blend-grid{
    display:grid;
    gap:14px;
    margin-top:18px;
  }

  .blend-card{
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px;
    background:#fff;
  }

  .blend-title{
    font-size:1.15rem;
    font-weight:800;
    margin:0 0 8px;
  }

  .dual-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:18px;
  }

  .tiny-note{
    margin-top:10px;
    font-size:13px;
    color:var(--muted);
  }

  @media (max-width:720px){
    .pupa-wrap{
      padding:12px;
    }

    .progress-wrap,
    .flow-wrap{
      padding-left:16px;
      padding-right:16px;
    }

    .inline-row,
    .question-actions,
    .dual-actions{
      flex-direction:column;
      align-items:stretch;
    }

    .btn{
      width:100%;
      justify-content:center;
    }

    .landing-main-title,
    .panel h1,
    .panel h2,
    .result-title,
    .cta-title,
    .q-title{
      max-width:none;
    }

    .quiz-hero::before{
      padding-top:64%;
    }

    .question-media::before,
    .result-media::before{
      padding-top:66%;
    }
  }
</style>
</head>

            { key: 'A', text: 'Build trust', result: 'empath' },
            { key: 'B', text: 'Drive energy', result: 'igniter' },
            { key: 'C', text: 'Stay reliable', result: 'anchor' }
          ]
        },
        {
          q: 'People say:',
          image: 'https://static.wixstatic.com/media/d1daaa_fe15a4e02e564acbb3eae58225f89804~mv2.png',
          options: [
            { key: 'A', text: 'Always solid', result: 'anchor' },
            { key: 'B', text: 'Feels like home', result: 'empath' },
            { key: 'C', text: 'Keeps us going', result: 'igniter' }
          ]
        }
      ],
      tieLabel: 'Blend',
      results: {
        igniter: {
          title: 'Igniter',
          emoji: '⚡',
          image: 'https://static.wixstatic.com/media/d1daaa_0a949f0441ee4b80b8305fecc103624f~mv2.png',
          line1: 'You bring the spark.',
          line2: 'You make things move.',
          line3: 'Just… don’t disappear halfway.'
        },
        anchor: {
          title: 'Anchor',
          emoji: '🧱',
          image: 'https://static.wixstatic.com/media/d1daaa_1dfdcb345c3f44a39e4fd4077c01152a~mv2.png',
          line1: 'You hold things steady.',
          line2: 'People rely on you.',
          line3: 'Just don’t carry everything alone.'
        },
        empath: {
          title: 'Empath',
          emoji: '🫀',
          image: 'https://static.wixstatic.com/media/d1daaa_4f80469237304f9ba752ab7f2a070c66~mv2.png',
          line1: 'You make people feel seen.',
          line2: 'You build real teams.',
          line3: 'Protect your energy too.'
        }
      }
    }
  ];

  const $ = (selector, root=document) => root.querySelector(selector);
  const $$ = (selector, root=document) => Array.from(root.querySelectorAll(selector));

  const screenIntro = $('#screen-intro');
  const screenQuestion = $('#screen-question');
  const screenEmail = $('#screen-email');
  const screenResult = $('#screen-result');
  const progressBar = $('#progressBar');
  const qText = $('#qText');
  const stepNum = $('#stepNum');
  const stepTotal = $('#stepTotal');
  const choicesWrap = $('#choicesWrap');
  const questionImageWrap = $('#questionImageWrap');
  const prevBtn = $('#prevBtn');
  const nextBtn = $('#nextBtn');
  const quizMetaNote = $('#quizMetaNote');
  const emailInput = $('#emailInput');
  const consent = $('#consent');
  const mcMsg = $('#mcMsg');
  const mcFname = $('#mcFname');
  const hpInput = $('#hp');
  const seeResultsBtn = $('#seeResultsBtn');
  const resultContainer = $('#resultContainer');
  const resultActionArea = $('#resultActionArea');
  const fbForm = $('#mcFallbackForm');
  const fbEmail = $('#fb_EMAIL');
  const fbFname = $('#fb_FNAME');
  const fbTags = $('#fb_TAGS');
  const fbHp = $('#fb_hp');

  let currentQuizIndex = 0;
  let currentQuestionIndex = 0;
  let answers = [];
  let autoTimer = null;
  let lastComputedResult = null;

  const journey = {
    sessionId: getOrCreateSessionId(),
    firstName: '',
    email: '',
    consent: false,
    completedQuizIds: [],
    hasSubmittedMailchimp: false,
    finalCtaClicked: false
  };

  function getOrCreateSessionId() {
    try {
      const existing = window.localStorage.getItem(STORAGE_KEY);
      if (existing) return existing;
      const created = 'pupa_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
      window.localStorage.setItem(STORAGE_KEY, created);
      return created;
    } catch (error) {
      return 'pupa_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
    }
  }

  function currentQuiz() {
    return QUIZZES[currentQuizIndex];
  }

  function escapeHTML(value) {
    return String(value || '').replace(/[&<>"']/g, function(ch) {
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]);
    });
  }

  function hidePanels() {
    screenIntro.classList.add('hidden');
    screenQuestion.classList.add('hidden');
    screenEmail.classList.add('hidden');
    screenResult.classList.add('hidden');
  }

  function resetQuizState() {
    currentQuestionIndex = 0;
    answers = Array(currentQuiz().questions.length).fill(null);
    autoTimer = null;
    lastComputedResult = null;
    nextBtn.disabled = true;
    stepTotal.textContent = String(currentQuiz().questions.length);
  }

  function updateProgress() {
    const total = currentQuiz().questions.length;
    if (!total) {
      progressBar.style.width = '0%';
      return;
    }

    let progressValue = 0;
    if (!screenQuestion.classList.contains('hidden')) {
      progressValue = ((currentQuestionIndex + 1) / total) * 100;
    } else if (!screenEmail.classList.contains('hidden') || !screenResult.classList.contains('hidden')) {
      progressValue = 100;
    }

    progressBar.style.width = Math.max(0, Math.min(100, progressValue)) + '%';
  }

  function renderIntro() {
    hidePanels();
    screenIntro.classList.remove('hidden');

    const quiz = currentQuiz();
    const isFirstQuiz = currentQuizIndex === 0;
    const heading = isFirstQuiz ? quiz.landingTitle : quiz.introTitle;
    const sub = isFirstQuiz ? quiz.landingSub : quiz.introSub;

    screenIntro.innerHTML = '' +
      '<div class="intro-stack">' +
        '<div class="brand-row">' +
          '<img src="https://static.wixstatic.com/shapes/d1daaa_70d588d61ad94dafb9274c7e8af7178c.svg" alt="Pupa" />' +
        '</div>' +
        '<div class="quiz-hero">' +
          '<img src="' + escapeHTML(quiz.image) + '" alt="' + escapeHTML(quiz.title) + ' image" />' +
        '</div>' +
        '<div class="intro-copy">' +
          '<div class="pill">Quiz ' + escapeHTML(quiz.number) + '</div>' +
          '<h1 class="landing-main-title">' + escapeHTML(heading) + '</h1>' +
          '<p>' + escapeHTML(sub) + '</p>' +
        '</div>' +
        '<div class="inline-row">' +
          '<div class="grow">' +
            (isFirstQuiz
              ? '<input id="nameInput" class="field" type="text" placeholder="First name (optional)" autocomplete="given-name" value="' + escapeHTML(journey.firstName) + '" />'
              : '<div class="tiny-note">Quick. Honest. Done in under a minute.</div>') +
          '</div>' +
          '<button id="startBtn" class="btn primary" type="button">' + escapeHTML(quiz.cta) + '</button>' +
        '</div>' +
      '</div>';

    $('#startBtn', screenIntro).addEventListener('click', function() {
      if (isFirstQuiz) {
        const input = $('#nameInput', screenIntro);
        journey.firstName = (input.value || '').trim();
        mcFname.value = journey.firstName;
      }
      logEvent('quiz_started', buildBasePayload({ note: 'Quiz intro started' }));
      loadQuestion(0);
    });

    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderChoiceOption(option, selectedKey) {
    return '' +
      '<button class="option' + (selectedKey === option.key ? ' selected' : '') + '" type="button" data-choice="' + escapeHTML(option.key) + '">' +
        '<span class="bullet"></span>' +
        '<span class="option-copy">' + escapeHTML(option.text) + '</span>' +
      '</button>';
  }

  function loadQuestion(index) {
    hidePanels();
    screenQuestion.classList.remove('hidden');
    currentQuestionIndex = index;

    const question = currentQuiz().questions[index];
    const selected = answers[index];
    stepNum.textContent = String(index + 1);
    qText.textContent = question.q;
    quizMetaNote.textContent = currentQuizIndex === 0 ? 'Go with your first instinct.' : 'Pick what feels most like you.';
    questionImageWrap.innerHTML = question.image
      ? '<div class="question-media"><img src="' + escapeHTML(question.image) + '" alt="' + escapeHTML(question.q) + '" loading="lazy" /></div>'
      : '';

    choicesWrap.innerHTML = question.options.map(function(option) {
      return renderChoiceOption(option, selected);
    }).join('');

    nextBtn.disabled = !selected;
    nextBtn.textContent = index === currentQuiz().questions.length - 1 ? 'Finish' : 'Next';

    $$('.option', choicesWrap).forEach(function(button) {
      button.addEventListener('click', function() {
        if (autoTimer) {
          clearTimeout(autoTimer);
          autoTimer = null;
        }

        const choiceKey = button.getAttribute('data-choice');
        answers[currentQuestionIndex] = choiceKey;
        lastComputedResult = null;

        $$('.option', choicesWrap).forEach(function(item) {
          item.classList.remove('selected');
        });
        button.classList.add('selected');
        nextBtn.disabled = false;

        autoTimer = setTimeout(function() {
          autoAdvanceOrFinish();
          autoTimer = null;
        }, 180);
      });
    });

    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function autoAdvanceOrFinish() {
    const total = currentQuiz().questions.length;
    if (currentQuestionIndex < total - 1) {
      loadQuestion(currentQuestionIndex + 1);
      return;
    }
    finishQuestionFlow();
  }

  function finishQuestionFlow() {
    if (journey.email && journey.consent) {
      showResult();
      return;
    }
    showEmailGate();
  }

  function showEmailGate() {
    hidePanels();
    screenEmail.classList.remove('hidden');
    emailInput.value = journey.email || '';
    consent.checked = !!journey.consent;
    mcFname.value = journey.firstName || '';
    mcMsg.textContent = '';
    mcMsg.className = 'msg muted';
    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function getSelectedOption(questionIndex, answerKey) {
    const question = currentQuiz().questions[questionIndex];
    if (!question) return null;
    return question.options.find(function(option) { return option.key === answerKey; }) || null;
  }

  function computeResult() {
    if (lastComputedResult) return lastComputedResult;

    const counts = {};
    Object.keys(currentQuiz().results).forEach(function(resultKey) {
      counts[resultKey] = 0;
    });

    answers.forEach(function(answerKey, index) {
      const selected = getSelectedOption(index, answerKey);
      if (selected && Object.prototype.hasOwnProperty.call(counts, selected.result)) {
        counts[selected.result] += 1;
      }
    });

    const max = Math.max.apply(null, Object.values(counts));
    const winners = Object.keys(counts).filter(function(resultKey) {
      return counts[resultKey] === max;
    });

    lastComputedResult = {
      counts: counts,
      winners: winners,
      single: winners.length === 1,
      primaryId: winners[0],
      primary: currentQuiz().results[winners[0]],
      title: winners.length === 1 ? currentQuiz().results[winners[0]].title : currentQuiz().tieLabel,
      resultKey: winners.join('+')
    };

    return lastComputedResult;
  }

  function buildAnswerPayload() {
    const payload = { answers_json: JSON.stringify(answers) };
    answers.forEach(function(answerKey, index) {
      const selected = getSelectedOption(index, answerKey);
      payload['answer_' + (index + 1) + '_key'] = answerKey || '';
      payload['answer_' + (index + 1) + '_text'] = selected ? selected.text : '';
      payload['answer_' + (index + 1) + '_result'] = selected ? selected.result : '';
    });
    return payload;
  }

  function buildBasePayload(extra) {
    const hasCompletedAnswers = answers.length > 0 && answers.every(function(answer) { return !!answer; });
    const resultInfo = hasCompletedAnswers ? computeResult() : null;

    return Object.assign({
      session_id: journey.sessionId,
      quiz_id: currentQuiz().id,
      quiz_title: currentQuiz().title,
      quiz_number: currentQuiz().number,
      flow_stage: !screenResult.classList.contains('hidden') ? 'result' : (!screenEmail.classList.contains('hidden') ? 'email_gate' : (!screenQuestion.classList.contains('hidden') ? 'question' : 'intro')),
      result_key: resultInfo ? resultInfo.resultKey : '',
      result_label: resultInfo ? resultInfo.title : '',
      email: journey.email || '',
      first_name: journey.firstName || '',
      consent: journey.consent ? 'Yes' : 'No',
      page_url: window.location.href,
      referrer: document.referrer || '',
      user_agent: navigator.userAgent || ''
    }, extra || {});
  }

  function markQuizCompleted() {
    if (journey.completedQuizIds.indexOf(currentQuiz().id) === -1) {
      journey.completedQuizIds.push(currentQuiz().id);
    }
    logEvent('quiz_completed', Object.assign(buildBasePayload({ flow_stage: 'completed' }), buildAnswerPayload()));
  }

  function renderSingleResult(profile) {
    return '' +
      '<div class="result-card">' +
        '<div class="result-eyebrow">Your result</div>' +
        '<h2 class="result-title">' + escapeHTML(profile.emoji + ' ' + profile.title) + '</h2>' +
        '<p class="result-sub">This feels true for more people than they admit.</p>' +
        (profile.image ? '<div class="result-media"><img src="' + escapeHTML(profile.image) + '" alt="' + escapeHTML(profile.title) + '" loading="lazy" /></div>' : '') +
        '<div class="result-lines">' +
          '<div class="result-line">' + escapeHTML(profile.line1) + '</div>' +
          '<div class="result-line">' + escapeHTML(profile.line2) + '</div>' +
          '<div class="result-line emphasis">' + escapeHTML(profile.line3) + '</div>' +
        '</div>' +
      '</div>';
  }

  function renderBlendResult(winners) {
    return '' +
      '<div class="result-card">' +
        '<div class="result-eyebrow">Your result</div>' +
        '<h2 class="result-title">You&rsquo;re a blend.</h2>' +
        '<p class="result-sub">You don&rsquo;t fit in one box — and that&rsquo;s the point.</p>' +
        '<div class="blend-grid">' +
          winners.map(function(resultKey) {
            const profile = currentQuiz().results[resultKey];
            return '' +
              '<div class="blend-card">' +
                '<h3 class="blend-title">' + escapeHTML(profile.emoji + ' ' + profile.title) + '</h3>' +
                (profile.image ? '<div class="result-media"><img src="' + escapeHTML(profile.image) + '" alt="' + escapeHTML(profile.title) + '" loading="lazy" /></div>' : '') +
                '<div class="result-lines">' +
                  '<div class="result-line">' + escapeHTML(profile.line1) + '</div>' +
                  '<div class="result-line">' + escapeHTML(profile.line2) + '</div>' +
                  '<div class="result-line emphasis">' + escapeHTML(profile.line3) + '</div>' +
                '</div>' +
              '</div>';
          }).join('') +
        '</div>' +
      '</div>';
  }

  function showResult() {
    hidePanels();
    screenResult.classList.remove('hidden');
    const resultInfo = computeResult();

    resultContainer.innerHTML = resultInfo.single
      ? renderSingleResult(resultInfo.primary)
      : renderBlendResult(resultInfo.winners);

    markQuizCompleted();
    renderResultActions();
    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderResultActions() {
    if (currentQuizIndex === 0) {
      const nextQuiz = QUIZZES[1];
      resultActionArea.innerHTML = '' +
        '<div class="cta-card">' +
          '<div class="cta-eyebrow">Next</div>' +
          '<h3 class="cta-title">' + escapeHTML(currentQuiz().transitionTitle) + '</h3>' +
          '<p class="cta-sub">' + escapeHTML(currentQuiz().transitionSub) + '</p>' +
          '<div class="dual-actions">' +
            '<button id="goToNextQuizBtn" class="btn primary" type="button">' + escapeHTML(currentQuiz().transitionButton) + '</button>' +
            '<a class="btn secondary" href="' + escapeHTML(PUPA_WEBSITE_QUIZ_URL) + '" target="_blank" rel="noopener noreferrer" id="skipToPupaBtn">' + escapeHTML(currentQuiz().transitionSkip) + '</a>' +
          '</div>' +
        '</div>';

      $('#goToNextQuizBtn', resultActionArea).addEventListener('click', function() {
        logEvent('next_quiz_clicked', buildBasePayload({ note: 'Moved from quiz 1 to quiz 2', prompt_target_quiz_id: nextQuiz.id }));
        currentQuizIndex = 1;
        resetQuizState();
        renderIntro();
      });

      $('#skipToPupaBtn', resultActionArea).addEventListener('click', function() {
        journey.finalCtaClicked = true;
        logEvent('website_click', buildBasePayload({ note: 'Skipped quiz 2 and clicked to Pupa' }));
      });

      return;
    }

    const quiz = currentQuiz();
    resultActionArea.innerHTML = '' +
      '<div class="cta-card">' +
        '<div class="cta-eyebrow">What next</div>' +
        '<h3 class="cta-title">' + escapeHTML(quiz.finalTitle) + '</h3>' +
        '<p class="cta-sub">' + escapeHTML(quiz.finalSub) + '</p>' +
        '<div class="dual-actions">' +
          '<a id="finalCtaBtn" class="btn primary" href="' + escapeHTML(PUPA_WEBSITE_QUIZ_URL) + '" target="_blank" rel="noopener noreferrer">' + escapeHTML(quiz.finalButton) + '</a>' +
          '<button id="restartBtn" class="btn secondary" type="button">Restart</button>' +
        '</div>' +
      '</div>';

    $('#finalCtaBtn', resultActionArea).addEventListener('click', function() {
      journey.finalCtaClicked = true;
      logEvent('website_click', buildBasePayload({ note: 'Clicked final Pupa CTA' }));
    });

    $('#restartBtn', resultActionArea).addEventListener('click', function() {
      restartFlow();
    });
  }

  function getMailchimpTagForResult(resultInfo) {
    const tags = currentQuiz().mailchimpTags || {};
    if (!resultInfo.single) return '';
    return tags[resultInfo.primaryId] || '';
  }

  function flattenPayload(payload) {
    const output = {};
    Object.keys(payload || {}).forEach(function(key) {
      const value = payload[key];
      if (value === undefined || value === null) {
        output[key] = '';
      } else if (typeof value === 'object') {
        output[key] = JSON.stringify(value);
      } else {
        output[key] = String(value);
      }
    });
    return output;
  }

  function sheetsEnabled() {
    return !!GOOGLE_SHEETS_WEB_APP_URL && GOOGLE_SHEETS_WEB_APP_URL.indexOf('PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') === -1;
  }

  function sendViaHiddenForm(url, params) {
    const iframeName = 'sheet_log_iframe';
    let iframe = document.getElementById(iframeName);
    if (!iframe) {
      iframe = document.createElement('iframe');
      iframe.id = iframeName;
      iframe.name = iframeName;
      iframe.className = 'hidden';
      document.body.appendChild(iframe);
    }

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = url;
    form.target = iframeName;
    form.className = 'hidden';

    Object.keys(params).forEach(function(key) {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = key;
      input.value = params[key];
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();
    setTimeout(function() {
      try { form.remove(); } catch (error) {}
    }, 1500);
  }

  function logEvent(eventType, payload) {
    if (!sheetsEnabled()) return;

    const params = flattenPayload(Object.assign({
      event_type: eventType,
      timestamp_iso_client: new Date().toISOString()
    }, payload || {}));

    try {
      fetch(GOOGLE_SHEETS_WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: new URLSearchParams(params)
      }).catch(function() {
        sendViaHiddenForm(GOOGLE_SHEETS_WEB_APP_URL, params);
      });
    } catch (error) {
      sendViaHiddenForm(GOOGLE_SHEETS_WEB_APP_URL, params);
    }
  }

  function submitMailchimpJSONP(params, timeoutMs) {
    return new Promise(function(resolve, reject) {
      const callbackName = 'mc_cb_' + Math.random().toString(36).slice(2);
      let timedOut = false;
      let cleaned = false;
      const script = document.createElement('script');
      let timer = null;

      function cleanup() {
        if (cleaned) return;
        cleaned = true;
        try { delete window[callbackName]; } catch (error) {}
        try { script.remove(); } catch (error) {}
        if (timer) clearTimeout(timer);
      }

      window[callbackName] = function(response) {
        if (timedOut) return;
        cleanup();
        resolve(response);
      };

      script.src = MAILCHIMP_POST_JSON_URL + '&' + new URLSearchParams(params).toString() + '&c=' + callbackName;
      script.async = true;
      script.onerror = function() {
        cleanup();
        reject(new Error('Network error'));
      };
      document.body.appendChild(script);

      timer = setTimeout(function() {
        timedOut = true;
        cleanup();
        reject(new Error('Timeout'));
      }, timeoutMs || 12000);
    });
  }

  function restartFlow() {
    if (autoTimer) {
      clearTimeout(autoTimer);
      autoTimer = null;
    }

    currentQuizIndex = 0;
    journey.firstName = '';
    journey.email = '';
    journey.consent = false;
    journey.completedQuizIds = [];
    journey.hasSubmittedMailchimp = false;
    journey.finalCtaClicked = false;

    emailInput.value = '';
    consent.checked = false;
    mcFname.value = '';
    mcMsg.textContent = '';
    resultContainer.innerHTML = '';
    resultActionArea.innerHTML = '';

    resetQuizState();
    renderIntro();
  }

  nextBtn.addEventListener('click', function() {
    if (!answers[currentQuestionIndex]) return;
    autoAdvanceOrFinish();
  });

  prevBtn.addEventListener('click', function() {
    if (autoTimer) {
      clearTimeout(autoTimer);
      autoTimer = null;
    }

    if (currentQuestionIndex === 0) {
      renderIntro();
      return;
    }

    loadQuestion(currentQuestionIndex - 1);
  });

  $('#mcForm').addEventListener('submit', async function(event) {
    event.preventDefault();
    mcMsg.className = 'msg muted';
    mcMsg.textContent = '';

    if ((hpInput.value || '').trim() !== '') {
      showResult();
      return;
    }

    const email = (emailInput.value || '').trim();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      mcMsg.className = 'msg error';
      mcMsg.textContent = 'Please enter a valid email address.';
      return;
    }

    if (!consent.checked) {
      mcMsg.className = 'msg error';
      mcMsg.textContent = 'Please tick the consent box to continue.';
      return;
    }

    journey.email = email;
    journey.consent = true;
    journey.firstName = journey.firstName || (mcFname.value || '').trim();

    seeResultsBtn.setAttribute('disabled', 'true');
    mcMsg.textContent = 'Saving...';

    const resultInfo = computeResult();
    const tagId = getMailchimpTagForResult(resultInfo);
    const params = {
      EMAIL: journey.email,
      FNAME: journey.firstName,
      tags: tagId,
      b_44c6260e44554e7b992e09185_083452c971: ''
    };

    try {
      const response = await submitMailchimpJSONP(params, 12000);
      journey.hasSubmittedMailchimp = true;
      if (response && response.result === 'success') {
        mcMsg.className = 'msg success';
        mcMsg.textContent = 'Success! Check your inbox in a few minutes.';
      } else {
        mcMsg.className = 'msg success';
        mcMsg.textContent = 'You may already be subscribed. Showing your result now.';
      }
      logEvent('email_captured', Object.assign(buildBasePayload({ note: 'Email captured at gate' }), { email: journey.email, consent: 'Yes' }));
      showResult();
    } catch (error) {
      try {
        fbEmail.value = journey.email;
        fbFname.value = journey.firstName;
        fbTags.value = tagId;
        fbHp.value = '';
        fbForm.submit();
      } catch (fallbackError) {}

      journey.hasSubmittedMailchimp = true;
      logEvent('email_captured', Object.assign(buildBasePayload({ note: 'Email captured via fallback path' }), { email: journey.email, consent: 'Yes' }));
      mcMsg.className = 'msg muted';
      mcMsg.textContent = 'Connection was spotty — proceeding anyway.';
      setTimeout(function() {
        showResult();
      }, 900);
    } finally {
      seeResultsBtn.removeAttribute('disabled');
    }
  });

  resetQuizState();
  renderIntro();
})();
</script>
