

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pupa Quiz Funnel - Personality to Internship Match</title>
<style>
  :root{
    --navy:#000080;
    --primary:#6C63FE;
    --white:#ffffff;
    --text:#0f172a;
    --muted:#667085;
    --line:#E6E8F0;
    --soft:#F7F8FF;
    --soft-2:#EEF0FF;
    --ring:rgba(108,99,254,.18);
    --success-bg:#EEF7F0;
    --success-line:#B7E4C0;
    --success-text:#166534;
    --error-bg:#FEF2F2;
    --error-line:#FECACA;
    --error-text:#991B1B;
    --shadow:0 18px 40px rgba(15,23,42,.08);
    --shadow-card:0 10px 24px rgba(15,23,42,.08);
    --font:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }

  html,body{
    margin:0;
    padding:0;
    background:transparent;
    color:var(--text);
    font-family:var(--font);
    font-size:16px;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  *{ box-sizing:border-box; }

  body{
    min-height:100vh;
  }

  .pupa-wrap{
    max-width:920px;
    margin:0 auto;
    padding:18px;
  }

  .pupa-shell{
    background:linear-gradient(180deg,#ffffff 0%, #fbfbff 100%);
    border:1px solid var(--line);
    border-radius:30px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }

  .screen{ display:none; }
  .screen.active{ display:block; }
  .hidden{ display:none !important; }

  .progress-wrap{
    padding:18px 22px 0;
  }

  .progress{
    height:8px;
    background:#edf0fb;
    border-radius:999px;
    overflow:hidden;
  }

  .bar{
    height:100%;
    width:0;
    background:linear-gradient(135deg, var(--primary) 0%, var(--navy) 100%);
    transition:width .25s ease;
  }

  .flow-wrap{
    max-width:760px;
    margin:0 auto;
    padding:18px 22px 30px;
  }

  .brand-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }

  .brand-row img{
    height:22px;
    width:auto;
    display:block;
  }

  .quiz-hero{
    position:relative;
    width:100%;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:22px;
    background:#f5f7ff;
    margin:0 0 18px;
  }

  .quiz-hero::before{
    content:"";
    display:block;
    padding-top:50%;
  }

  .quiz-hero img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .quiz-hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(15,23,42,.06) 0%, rgba(15,23,42,.24) 100%);
    pointer-events:none;
  }

  .landing-main-title,
  .panel h1,
  .panel h2,
  .result-title,
  .cta-title{
    font-size:clamp(2rem, 4.2vw, 3rem);
    line-height:1.05;
    letter-spacing:-.04em;
    margin:0;
    max-width:18ch;
  }

  .panel p,
  .result-sub,
  .cta-sub{
    margin:10px 0 0;
    color:var(--muted);
    line-height:1.6;
    font-size:15px;
    max-width:60ch;
  }

  .pill{
    display:inline-flex;
    align-items:center;
    padding:8px 12px;
    border-radius:999px;
    background:var(--soft);
    color:var(--navy);
    font-size:12px;
    font-weight:800;
    margin-bottom:12px;
  }

  .pill.small{
    padding:6px 10px;
    font-size:11px;
    margin-bottom:10px;
  }

  .intro-stack,
  .result-stack{
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .intro-copy{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .field{
    width:100%;
    min-height:52px;
    padding:14px 16px;
    border:1px solid var(--line);
    border-radius:16px;
    font-size:16px;
    color:var(--text);
    background:#fff;
    outline:none;
    transition:border-color .18s ease, box-shadow .18s ease;
  }

  .field:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 4px var(--ring);
  }

  .inline-row{
    display:flex;
    gap:12px;
    align-items:center;
    margin-top:8px;
  }

  .grow{ flex:1; }

  .btn{
    appearance:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:52px;
    padding:14px 18px;
    border-radius:14px;
    border:1px solid transparent;
    font-weight:800;
    cursor:pointer;
    transition:.18s ease;
    text-align:center;
    white-space:nowrap;
    text-decoration:none;
    font-size:15px;
  }

  .btn.primary{
    background:linear-gradient(135deg, var(--primary) 0%, var(--navy) 100%);
    color:#fff;
    box-shadow:0 12px 24px rgba(108,99,254,.22);
  }

  .btn.primary:hover{ filter:brightness(1.03); }
  .btn.primary:active{ transform:translateY(1px); }

  .btn.secondary{
    background:#fff;
    border-color:var(--line);
    color:var(--text);
  }

  .btn.secondary:hover{ background:var(--soft); }

  .btn.ghost{
    background:transparent;
    color:var(--muted);
    border-color:transparent;
    box-shadow:none;
    min-height:auto;
    padding:0;
  }

  .btn:disabled{
    opacity:.55;
    cursor:not-allowed;
  }

  .question-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:12px;
  }

  .back-btn{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--muted);
    font-weight:700;
    padding:0;
    cursor:pointer;
  }

  .q-title{
    font-size:clamp(1.8rem, 4vw, 2.6rem);
    line-height:1.08;
    letter-spacing:-.04em;
    margin:8px 0 0;
    max-width:16ch;
  }

  .question-media,
  .result-media,
  .recommend-media{
    position:relative;
    width:100%;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:20px;
    background:#f5f7ff;
  }

  .question-media{
    margin-top:16px;
  }

  .result-media{
    margin:14px 0 0;
  }

  .question-media::before,
  .result-media::before,
  .recommend-media::before{
    content:"";
    display:block;
    padding-top:58%;
  }

  .question-media img,
  .result-media img,
  .recommend-media img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .recommend-media{
    border:none;
    border-radius:0;
  }

  .choices{
    display:grid;
    gap:12px;
    margin-top:18px;
  }

  .option{
    display:flex;
    gap:12px;
    align-items:center;
    padding:16px;
    border:1.5px solid var(--line);
    border-radius:18px;
    background:#fff;
    cursor:pointer;
    transition:.18s ease;
    text-align:left;
  }

  .option:hover,
  .option:focus-visible{
    border-color:#cfd5ea;
    background:#fcfcff;
    outline:none;
  }

  .option.selected{
    border-color:var(--primary);
    background:var(--soft);
  }

  .bullet{
    width:18px;
    height:18px;
    border:1.8px solid #cfd5ea;
    border-radius:50%;
    flex:0 0 auto;
    position:relative;
    background:#fff;
  }

  .option.selected .bullet{
    border-color:var(--primary);
  }

  .option.selected .bullet::after{
    content:"";
    position:absolute;
    inset:4px;
    border-radius:50%;
    background:var(--primary);
  }

  .option-copy{
    font-size:16px;
    font-weight:800;
    line-height:1.35;
  }

  .question-actions{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:16px;
    align-items:center;
  }

  .email-card,
  .result-card,
  .cta-card,
  .mini-card,
  .recommend-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:22px;
    padding:18px;
    box-shadow:var(--shadow-card);
  }

  .recommend-card{
    padding:0;
    overflow:hidden;
  }

  #resultActionArea{
    margin-top:18px;
  }

  .email-eyebrow,
  .result-eyebrow,
  .cta-eyebrow,
  .mini-label{
    font-size:12px;
    font-weight:800;
    color:var(--navy);
    text-transform:uppercase;
    letter-spacing:.08em;
    margin-bottom:10px;
  }

  .consent{
    display:flex;
    gap:10px;
    align-items:flex-start;
    margin-top:12px;
    color:var(--muted);
    font-size:14px;
    line-height:1.55;
  }

  .consent input{ margin-top:3px; }

  .msg{
    margin-top:12px;
    min-height:18px;
    font-size:14px;
  }

  .success{
    background:var(--success-bg);
    border:1px solid var(--success-line);
    color:var(--success-text);
    padding:12px 14px;
    border-radius:12px;
  }

  .error{
    background:var(--error-bg);
    border:1px solid var(--error-line);
    color:var(--error-text);
    padding:12px 14px;
    border-radius:12px;
  }

  .muted{ color:var(--muted); }

  .result-sub{
    margin-top:8px;
  }

  .result-lines{
    display:grid;
    gap:10px;
    margin-top:18px;
  }

  .result-line{
    padding:14px 16px;
    border:1px solid var(--line);
    border-radius:16px;
    background:#fff;
    font-size:15px;
    font-weight:700;
    line-height:1.5;
  }

  .result-line.emphasis{
    background:var(--soft);
    border-color:#d9ddfb;
  }

  .pair-grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:14px;
    margin-top:18px;
  }

  .mini-card{
    padding:16px;
  }

  .mini-title{
    font-size:1.15rem;
    font-weight:800;
    margin:0;
  }

  .mini-copy{
    margin-top:8px;
    color:var(--muted);
    font-size:14px;
    line-height:1.55;
  }

  .blend-grid{
    display:grid;
    gap:14px;
    margin-top:18px;
  }

  .blend-card{
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px;
    background:#fff;
  }

  .blend-title{
    font-size:1.15rem;
    font-weight:800;
    margin:0 0 8px;
  }

  .recommend-grid{
    display:grid;
    gap:16px;
    margin-top:18px;
  }

  .recommend-body{
    padding:18px;
  }

  .recommend-badge{
    display:inline-flex;
    align-items:center;
    padding:7px 11px;
    border-radius:999px;
    background:var(--soft);
    color:var(--navy);
    font-size:12px;
    font-weight:800;
    margin-bottom:12px;
  }

  .recommend-title{
    font-size:clamp(1.45rem, 3vw, 1.95rem);
    line-height:1.15;
    letter-spacing:-.03em;
    margin:0;
  }

  .recommend-copy{
    margin-top:10px;
    color:var(--muted);
    line-height:1.65;
    font-size:15px;
  }

  .recommend-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:18px;
  }

  .dual-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:18px;
  }

  .summary-note{
    margin-top:12px;
    font-size:14px;
    color:var(--muted);
    line-height:1.6;
  }

  .tiny-note{
    margin-top:10px;
    font-size:13px;
    color:var(--muted);
  }

  @media (max-width:720px){
    .pupa-wrap{
      padding:12px;
    }

    .progress-wrap,
    .flow-wrap{
      padding-left:16px;
      padding-right:16px;
    }

    .inline-row,
    .question-actions,
    .dual-actions,
    .recommend-actions{
      flex-direction:column;
      align-items:stretch;
    }

    .pair-grid{
      grid-template-columns:1fr;
    }

    .btn{
      width:100%;
      justify-content:center;
      white-space:normal;
    }

    .btn.ghost{
      width:auto;
      justify-content:flex-start;
    }

    .landing-main-title,
    .panel h1,
    .panel h2,
    .result-title,
    .cta-title,
    .q-title{
      max-width:none;
    }

    .quiz-hero::before{
      padding-top:64%;
    }

    .question-media::before,
    .result-media::before,
    .recommend-media::before{
      padding-top:66%;
    }
  }
</style>
</head>

  </div>
</div>

    clarifier: 'roles where judgement, pattern-spotting, and clear thinking matter',
    grower: 'roles where people or teams can improve over time'
  };

  const $ = (selector, root=document) => root.querySelector(selector);
  const $$ = (selector, root=document) => Array.from(root.querySelectorAll(selector));

  const screenIntro = $('#screen-intro');
  const screenQuestion = $('#screen-question');
  const screenEmail = $('#screen-email');
  const screenResult = $('#screen-result');
  const progressBar = $('#progressBar');
  const qText = $('#qText');
  const stepNum = $('#stepNum');
  const stepTotal = $('#stepTotal');
  const choicesWrap = $('#choicesWrap');
  const questionImageWrap = $('#questionImageWrap');
  const prevBtn = $('#prevBtn');
  const nextBtn = $('#nextBtn');
  const quizMetaNote = $('#quizMetaNote');
  const emailInput = $('#emailInput');
  const consent = $('#consent');
  const mcMsg = $('#mcMsg');
  const mcFname = $('#mcFname');
  const hpInput = $('#hp');
  const seeResultsBtn = $('#seeResultsBtn');
  const resultContainer = $('#resultContainer');
  const resultActionArea = $('#resultActionArea');
  const fbForm = $('#mcFallbackForm');
  const fbEmail = $('#fb_EMAIL');
  const fbFname = $('#fb_FNAME');
  const fbTags = $('#fb_TAGS');
  const fbHp = $('#fb_hp');

  let currentQuizIndex = 0;
  let currentQuestionIndex = 0;
  let answers = [];
  let autoTimer = null;
  let lastComputedResult = null;

  const journey = {
    sessionId: getOrCreateSessionId(),
    firstName: '',
    email: '',
    consent: false,
    completedQuizIds: [],
    hasSubmittedMailchimp: false,
    finalCtaClicked: false,
    profileResult: null,
    matchResult: null
  };

  function getOrCreateSessionId() {
    try {
      const existing = window.localStorage.getItem(STORAGE_KEY);
      if (existing) return existing;
      const created = 'pupa_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
      window.localStorage.setItem(STORAGE_KEY, created);
      return created;
    } catch (error) {
      return 'pupa_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
    }
  }

  function currentQuiz() {
    return QUIZZES[currentQuizIndex];
  }

  function escapeHTML(value) {
    return String(value || '').replace(/[&<>"']/g, function(ch) {
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]);
    });
  }

  function hidePanels() {
    screenIntro.classList.add('hidden');
    screenQuestion.classList.add('hidden');
    screenEmail.classList.add('hidden');
    screenResult.classList.add('hidden');
  }

  function resetQuizState() {
    currentQuestionIndex = 0;
    answers = Array(currentQuiz().questions.length).fill(null);
    autoTimer = null;
    lastComputedResult = null;
    nextBtn.disabled = true;
    stepTotal.textContent = String(currentQuiz().questions.length);
  }

  function updateProgress() {
    const total = currentQuiz().questions.length;
    if (!total) {
      progressBar.style.width = '0%';
      return;
    }

    let progressValue = 0;
    if (!screenQuestion.classList.contains('hidden')) {
      progressValue = ((currentQuestionIndex + 1) / total) * 100;
    } else if (!screenEmail.classList.contains('hidden') || !screenResult.classList.contains('hidden')) {
      progressValue = 100;
    }

    progressBar.style.width = Math.max(0, Math.min(100, progressValue)) + '%';
  }

  function renderIntro() {
    hidePanels();
    screenIntro.classList.remove('hidden');

    const quiz = currentQuiz();
    const isFirstQuiz = currentQuizIndex === 0;
    const heading = isFirstQuiz ? quiz.landingTitle : quiz.introTitle;
    const sub = isFirstQuiz ? quiz.landingSub : quiz.introSub;
    const secondQuizNote = journey.profileResult
      ? ('You got ' + journey.profileResult.animal.title + ' + ' + journey.profileResult.energy.title + '. Now let\'s match that to real roles.')
      : (quiz.introNote || '6 quick picks. Real matches. No guesswork.');

    screenIntro.innerHTML = '' +
      '<div class="intro-stack">' +
        '<div class="brand-row">' +
          '<img src="https://static.wixstatic.com/shapes/d1daaa_70d588d61ad94dafb9274c7e8af7178c.svg" alt="Pupa" />' +
        '</div>' +
        '<div class="quiz-hero">' +
          '<img src="' + escapeHTML(quiz.image) + '" alt="' + escapeHTML(quiz.title) + ' image" />' +
        '</div>' +
        '<div class="intro-copy">' +
          '<div class="pill">Quiz ' + escapeHTML(quiz.number) + '</div>' +
          '<h1 class="landing-main-title">' + escapeHTML(heading) + '</h1>' +
          '<p>' + escapeHTML(sub) + '</p>' +
        '</div>' +
        '<div class="inline-row">' +
          '<div class="grow">' +
            (isFirstQuiz
              ? '<input id="nameInput" class="field" type="text" placeholder="First name (optional)" autocomplete="given-name" value="' + escapeHTML(journey.firstName) + '" />'
              : '<div class="tiny-note">' + escapeHTML(secondQuizNote) + '</div>') +
          '</div>' +
          '<button id="startBtn" class="btn primary" type="button">' + escapeHTML(quiz.cta) + '</button>' +
        '</div>' +
      '</div>';

    $('#startBtn', screenIntro).addEventListener('click', function() {
      if (isFirstQuiz) {
        const input = $('#nameInput', screenIntro);
        journey.firstName = (input.value || '').trim();
        mcFname.value = journey.firstName;
      }
      logEvent('quiz_started', buildBasePayload({ note: 'Quiz intro started' }));
      loadQuestion(0);
    });

    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderChoiceOption(option, selectedKey) {
    return '' +
      '<button class="option' + (selectedKey === option.key ? ' selected' : '') + '" type="button" data-choice="' + escapeHTML(option.key) + '">' +
        '<span class="bullet"></span>' +
        '<span class="option-copy">' + escapeHTML(option.text) + '</span>' +
      '</button>';
  }

  function loadQuestion(index) {
    hidePanels();
    screenQuestion.classList.remove('hidden');
    currentQuestionIndex = index;

    const question = currentQuiz().questions[index];
    const selected = answers[index];
    stepNum.textContent = String(index + 1);
    qText.textContent = question.q;
    quizMetaNote.textContent = currentQuiz().kind === 'profile' ? 'Go with your first instinct.' : 'Pick the one that feels most natural.';
    questionImageWrap.innerHTML = question.image
      ? '<div class="question-media"><img src="' + escapeHTML(question.image) + '" alt="' + escapeHTML(question.q) + '" loading="lazy" /></div>'
      : '';

    choicesWrap.innerHTML = question.options.map(function(option) {
      return renderChoiceOption(option, selected);
    }).join('');

    nextBtn.disabled = !selected;
    if (index === currentQuiz().questions.length - 1) {
      nextBtn.textContent = currentQuiz().kind === 'profile' ? 'See my result' : 'See my matches';
    } else {
      nextBtn.textContent = 'Next';
    }

    $$('.option', choicesWrap).forEach(function(button) {
      button.addEventListener('click', function() {
        if (autoTimer) {
          clearTimeout(autoTimer);
          autoTimer = null;
        }

        const choiceKey = button.getAttribute('data-choice');
        answers[currentQuestionIndex] = choiceKey;
        lastComputedResult = null;

        $$('.option', choicesWrap).forEach(function(item) {
          item.classList.remove('selected');
        });
        button.classList.add('selected');
        nextBtn.disabled = false;

        autoTimer = setTimeout(function() {
          autoAdvanceOrFinish();
          autoTimer = null;
        }, 180);
      });
    });

    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function autoAdvanceOrFinish() {
    const total = currentQuiz().questions.length;
    if (currentQuestionIndex < total - 1) {
      loadQuestion(currentQuestionIndex + 1);
      return;
    }
    finishQuestionFlow();
  }

  function finishQuestionFlow() {
    if (currentQuiz().kind === 'profile') {
      if (journey.email && journey.consent) {
        showResult();
        return;
      }
      showEmailGate();
      return;
    }
    showResult();
  }

  function showEmailGate() {
    hidePanels();
    screenEmail.classList.remove('hidden');
    emailInput.value = journey.email || '';
    consent.checked = !!journey.consent;
    mcFname.value = journey.firstName || '';
    mcMsg.textContent = '';
    mcMsg.className = 'msg muted';
    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function getSelectedOption(questionIndex, answerKey) {
    const question = currentQuiz().questions[questionIndex];
    if (!question) return null;
    return question.options.find(function(option) { return option.key === answerKey; }) || null;
  }

  function initScoreMap(source) {
    const out = {};
    Object.keys(source || {}).forEach(function(key) {
      out[key] = 0;
    });
    return out;
  }

  function addScores(target, scores) {
    Object.keys(scores || {}).forEach(function(key) {
      target[key] = (target[key] || 0) + Number(scores[key] || 0);
    });
  }

  function getTopKeysFromScores(scores, order) {
    const entries = Object.keys(scores || {}).map(function(key) {
      return { key: key, value: Number(scores[key] || 0), order: order.indexOf(key) };
    }).sort(function(a, b) {
      if (b.value !== a.value) return b.value - a.value;
      return a.order - b.order;
    });

    if (!entries.length) return [];
    const max = entries[0].value;
    return entries.filter(function(entry) {
      return entry.value === max;
    }).map(function(entry) {
      return entry.key;
    });
  }

  function rankDimension(totals, wins, order) {
    return Object.keys(totals || {}).map(function(key) {
      return {
        key: key,
        total: Number(totals[key] || 0),
        wins: Number(wins[key] || 0),
        order: order.indexOf(key)
      };
    }).sort(function(a, b) {
      if (b.total !== a.total) return b.total - a.total;
      if (b.wins !== a.wins) return b.wins - a.wins;
      return a.order - b.order;
    });
  }

  function getOptionalBlendLine(ranking, profiles, lineType) {
    if (!ranking || ranking.length < 2) return '';
    const first = ranking[0];
    const second = ranking[1];
    if (first.total - second.total > 1) return '';
    const profile = profiles[second.key];
    if (!profile) return '';
    return lineType === 'animal'
      ? 'There is also a little ' + profile.title + ' energy in how you operate.'
      : 'You also show some ' + profile.title + ' energy depending on the room you are in.';
  }

  function computeProfileResult() {
    if (lastComputedResult) return lastComputedResult;

    const animalTotals = initScoreMap(ANIMAL_PROFILES);
    const energyTotals = initScoreMap(ENERGY_PROFILES);
    const animalWins = initScoreMap(ANIMAL_PROFILES);
    const energyWins = initScoreMap(ENERGY_PROFILES);

    answers.forEach(function(answerKey, index) {
      const selected = getSelectedOption(index, answerKey);
      const question = currentQuiz().questions[index];
      if (!selected || !question || !selected.scores) return;

      if (question.dimension === 'animal') {
        addScores(animalTotals, selected.scores);
        getTopKeysFromScores(selected.scores, ANIMAL_ORDER).forEach(function(key) {
          animalWins[key] = (animalWins[key] || 0) + 1;
        });
      } else {
        addScores(energyTotals, selected.scores);
        getTopKeysFromScores(selected.scores, ENERGY_ORDER).forEach(function(key) {
          energyWins[key] = (energyWins[key] || 0) + 1;
        });
      }
    });

    const animalRanking = rankDimension(animalTotals, animalWins, ANIMAL_ORDER);
    const energyRanking = rankDimension(energyTotals, energyWins, ENERGY_ORDER);

    const animalId = animalRanking[0] ? animalRanking[0].key : 'fox';
    const energyId = energyRanking[0] ? energyRanking[0].key : 'clarifier';
    const animal = Object.assign({ id: animalId }, ANIMAL_PROFILES[animalId]);
    const energy = Object.assign({ id: energyId }, ENERGY_PROFILES[energyId]);

    lastComputedResult = {
      kind: 'profile',
      animal: animal,
      energy: energy,
      animalScores: animalTotals,
      energyScores: energyTotals,
      animalRanking: animalRanking,
      energyRanking: energyRanking,
      resultKey: animalId + '|' + energyId
    };

    return lastComputedResult;
  }

  function getTagPreferenceTemplate() {
    const out = {};
    Object.keys(TAG_LABELS).forEach(function(key) {
      out[key] = 0;
    });
    return out;
  }

  function scoreInternship(item, preferences) {
    let score = Number(item.priority || 0);
    Object.keys(item.tags || {}).forEach(function(tag) {
      score += Number(item.tags[tag] || 0) * Number(preferences[tag] || 0);
    });
    return score;
  }

  function pickRecommendations(scored, count) {
    const picks = [];
    const seenTitles = new Set();

    scored.forEach(function(item) {
      if (picks.length >= count) return;
      if (seenTitles.has(item.title)) return;
      picks.push(item);
      seenTitles.add(item.title);
    });

    return picks;
  }

  function computeMatchResult() {
    if (lastComputedResult) return lastComputedResult;

    const preferenceScores = getTagPreferenceTemplate();
    answers.forEach(function(answerKey, index) {
      const selected = getSelectedOption(index, answerKey);
      if (!selected || !selected.scores) return;
      addScores(preferenceScores, selected.scores);
    });

    if (journey.profileResult) {
      addScores(preferenceScores, (PROFILE_TAG_MODIFIERS.animals || {})[journey.profileResult.animal.id] || {});
      addScores(preferenceScores, (PROFILE_TAG_MODIFIERS.energies || {})[journey.profileResult.energy.id] || {});
    }

    const scored = INTERNSHIPS.map(function(item) {
      return Object.assign({}, item, { score: scoreInternship(item, preferenceScores) });
    }).sort(function(a, b) {
      if (b.score !== a.score) return b.score - a.score;
      if (Number(b.priority || 0) !== Number(a.priority || 0)) return Number(b.priority || 0) - Number(a.priority || 0);
      return a.title.localeCompare(b.title);
    });

    const recommendations = pickRecommendations(scored, 2);
    const topTags = Object.keys(preferenceScores).sort(function(a, b) {
      if (preferenceScores[b] !== preferenceScores[a]) return preferenceScores[b] - preferenceScores[a];
      return a.localeCompare(b);
    }).filter(function(key) {
      return Number(preferenceScores[key] || 0) > 0;
    }).slice(0, 3);

    const primaryFamilyId = recommendations[0] ? recommendations[0].family : '';

    lastComputedResult = {
      kind: 'match',
      preferenceScores: preferenceScores,
      topTags: topTags,
      topTagPhrases: topTags.map(function(key) { return TAG_LABELS[key]; }).filter(Boolean),
      primaryFamilyId: primaryFamilyId,
      primaryFamily: ROLE_FAMILIES[primaryFamilyId] || null,
      recommendations: recommendations,
      resultKey: recommendations.map(function(item) { return item.title; }).join(' | ')
    };

    return lastComputedResult;
  }

  function computeResult() {
    return currentQuiz().kind === 'profile' ? computeProfileResult() : computeMatchResult();
  }

  function joinPhrases(items) {
    const cleaned = (items || []).filter(Boolean);
    if (!cleaned.length) return '';
    if (cleaned.length === 1) return cleaned[0];
    if (cleaned.length === 2) return cleaned[0] + ' and ' + cleaned[1];
    return cleaned.slice(0, -1).join(', ') + ', and ' + cleaned[cleaned.length - 1];
  }

  function getCombinedCareerLine(animal, energy) {
    return animal.careerLine + ' You are especially strong in ' + (PROFILE_COMBO_LINES[energy.id] || 'roles that feel aligned with how you naturally work') + '.';
  }

  function renderProfileResult(resultInfo) {
    const animal = resultInfo.animal;
    const energy = resultInfo.energy;
    const heading = journey.firstName
      ? journey.firstName + ', your result is ' + animal.title + ' with ' + energy.title + ' energy.'
      : 'Your result is ' + animal.title + ' with ' + energy.title + ' energy.';
    const quoteLine = animal.details && animal.details[0] ? animal.details[0].text : animal.hook;
    const blendNote = [getOptionalBlendLine(resultInfo.animalRanking, ANIMAL_PROFILES, 'animal'), getOptionalBlendLine(resultInfo.energyRanking, ENERGY_PROFILES, 'energy')].filter(Boolean).join(' ');

    return '' +
      '<div class="result-card">' +
        '<div class="result-eyebrow">Your profile</div>' +
        '<h2 class="result-title">' + escapeHTML(heading) + '</h2>' +
        '<p class="result-sub">' + escapeHTML(animal.hook + ' ' + energy.hook) + '</p>' +
        (animal.image ? '<div class="result-media"><img src="' + escapeHTML(animal.image) + '" alt="' + escapeHTML(animal.title) + '" loading="lazy" /></div>' : '') +
        '<div class="pair-grid">' +
          '<div class="mini-card">' +
            '<div class="mini-label">Personality</div>' +
            '<h3 class="mini-title">' + escapeHTML(animal.emoji + ' ' + animal.title) + '</h3>' +
            '<p class="mini-copy">' + escapeHTML(animal.subtitle) + '</p>' +
          '</div>' +
          '<div class="mini-card">' +
            '<div class="mini-label">Team energy</div>' +
            '<h3 class="mini-title">' + escapeHTML(energy.emoji + ' ' + energy.title) + '</h3>' +
            '<p class="mini-copy">' + escapeHTML(energy.subtitle) + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="result-lines">' +
          '<div class="result-line emphasis">' + escapeHTML(quoteLine) + '</div>' +
          '<div class="result-line">How you naturally work: ' + escapeHTML(animal.hook) + '</div>' +
          '<div class="result-line">How people experience you: ' + escapeHTML(energy.hook) + '</div>' +
          '<div class="result-line">Where you usually shine: ' + escapeHTML(getCombinedCareerLine(animal, energy)) + '</div>' +
        '</div>' +
        (blendNote ? '<div class="summary-note">' + escapeHTML(blendNote) + '</div>' : '') +
      '</div>';
  }

  function getRecommendationReason(item, resultInfo) {
    const profile = journey.profileResult || computeProfileResult();
    const family = ROLE_FAMILIES[item.family] || {};
    const topFocus = resultInfo.topTagPhrases.slice(0, 2).map(function(phrase) {
      return String(phrase || '').toLowerCase();
    });
    const focusLine = topFocus.length ? ' Your second quiz also leaned toward ' + joinPhrases(topFocus) + '.' : '';
    return 'This fits because your result was ' + profile.animal.title + ' with ' + profile.energy.title + ' energy, and you usually do best when you can ' + (family.matchLine || 'work in a way that feels natural to you') + '.' + focusLine;
  }

  function getRecommendationSummary(resultInfo) {
    const top = resultInfo.recommendations[0];
    const profile = journey.profileResult || computeProfileResult();
    const family = ROLE_FAMILIES[resultInfo.primaryFamilyId] || {};
    const tagLine = resultInfo.topTagPhrases.length
      ? 'Your answers leaned toward ' + joinPhrases(resultInfo.topTagPhrases.map(function(phrase) { return String(phrase || '').toLowerCase(); })) + '. '
      : '';
    return '' +
      '<div class="result-card">' +
        '<div class="result-eyebrow">Your internship matches</div>' +
        '<h2 class="result-title">' + escapeHTML(top ? 'Your top match is ' + top.title + '.' : 'Your best matches are ready.') + '</h2>' +
        '<p class="result-sub">' + escapeHTML(tagLine + 'Based on your ' + profile.animal.title + ' result and ' + profile.energy.title + ' energy, these are the roles that feel most aligned right now.') + '</p>' +
        '<div class="result-lines">' +
          '<div class="result-line emphasis">' + escapeHTML(family.description || 'These matches fit the way you think, move, and work with other people.') + '</div>' +
          '<div class="result-line">Your lane right now: ' + escapeHTML(family.title || 'Best-fit path') + '</div>' +
          '<div class="result-line">Why these showed up: ' + escapeHTML((family.matchLine || 'they fit the way you naturally work') + '.') + '</div>' +
        '</div>' +
      '</div>';
  }

  function renderRecommendationCard(item, rank, resultInfo) {
    const family = ROLE_FAMILIES[item.family] || {};
    const badge = rank === 1 ? 'Best first fit' : 'Strong second fit';
    const buttonText = rank === 1 ? 'Explore this role' : 'See this role';

    return '' +
      '<article class="recommend-card">' +
        (item.image ? '<div class="recommend-media"><img src="' + escapeHTML(item.image) + '" alt="' + escapeHTML(item.title) + '" loading="lazy" /></div>' : '') +
        '<div class="recommend-body">' +
          '<div class="recommend-badge">' + escapeHTML(badge) + '</div>' +
          '<div class="pill small">' + escapeHTML(family.title || 'Internship match') + '</div>' +
          '<h3 class="recommend-title">' + escapeHTML(item.title) + '</h3>' +
          '<p class="recommend-copy">' + escapeHTML(getRecommendationReason(item, resultInfo)) + '</p>' +
          '<div class="result-lines">' +
            '<div class="result-line emphasis">' + escapeHTML(item.overviewShort) + '</div>' +
            '<div class="result-line">You’ll practise: ' + escapeHTML(item.tasksShort) + '</div>' +
            '<div class="result-line">Good if you enjoy: ' + escapeHTML(family.bestFor || 'work that feels aligned with how you think and move') + '</div>' +
          '</div>' +
          '<div class="recommend-actions">' +
            '<a class="btn ' + (rank === 1 ? 'primary' : 'secondary') + ' js-outbound-link" href="' + escapeHTML(item.url) + '" target="_blank" rel="noopener noreferrer" data-role-title="' + escapeHTML(item.title) + '" data-role-rank="' + escapeHTML(String(rank)) + '" data-role-url="' + escapeHTML(item.url) + '">' + escapeHTML(buttonText) + '</a>' +
          '</div>' +
        '</div>' +
      '</article>';
  }

  function renderMatchResult(resultInfo) {
    const cards = resultInfo.recommendations.map(function(item, index) {
      return renderRecommendationCard(item, index + 1, resultInfo);
    }).join('');

    return getRecommendationSummary(resultInfo) +
      '<div class="recommend-grid">' + cards + '</div>';
  }

  function showResult() {
    hidePanels();
    screenResult.classList.remove('hidden');

    const resultInfo = computeResult();
    if (currentQuiz().kind === 'profile') {
      journey.profileResult = resultInfo;
      resultContainer.innerHTML = renderProfileResult(resultInfo);
    } else {
      journey.matchResult = resultInfo;
      resultContainer.innerHTML = renderMatchResult(resultInfo);
    }

    markQuizCompleted(resultInfo);
    renderResultActions(resultInfo);
    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function attachOutboundTracking(root) {
    $$('.js-outbound-link', root).forEach(function(link) {
      link.addEventListener('click', function() {
        journey.finalCtaClicked = true;
        const destinationUrl = link.getAttribute('data-role-url') || link.href || '';
        const destinationTitle = link.getAttribute('data-role-title') || '';
        const recommendationRank = link.getAttribute('data-role-rank') || '';
        logEvent('website_click', buildBasePayload({
          note: 'Clicked simulation CTA',
          destination_url: destinationUrl,
          destination_title: destinationTitle,
          recommendation_rank: recommendationRank
        }));
      });
    });
  }

  function renderResultActions(resultInfo) {
    if (currentQuiz().kind === 'profile') {
      resultActionArea.innerHTML = '' +
        '<div class="cta-card">' +
          '<div class="cta-eyebrow">Next</div>' +
          '<h3 class="cta-title">' + escapeHTML(currentQuiz().transitionTitle) + '</h3>' +
          '<p class="cta-sub">' + escapeHTML(currentQuiz().transitionSub) + '</p>' +
          '<div class="dual-actions">' +
            '<button id="goToNextQuizBtn" class="btn primary" type="button">' + escapeHTML(currentQuiz().transitionButton) + '</button>' +
          '</div>' +
          '<div class="tiny-note">' + escapeHTML(currentQuiz().transitionNote || "6 quick picks. You'll stay right here.") + '</div>' +
        '</div>';

      $('#goToNextQuizBtn', resultActionArea).addEventListener('click', function() {
        logEvent('next_quiz_clicked', buildBasePayload({ note: 'Moved from quiz 1 to quiz 2', prompt_target_quiz_id: QUIZZES[1].id }));
        currentQuizIndex = 1;
        resetQuizState();
        renderIntro();
      });
      return;
    }

    const top = resultInfo.recommendations[0];
    const second = resultInfo.recommendations[1];
    resultActionArea.innerHTML = '' +
      '<div class="cta-card">' +
        '<div class="cta-eyebrow">Best next step</div>' +
        '<h3 class="cta-title">' + escapeHTML(top ? 'Your best match right now: ' + top.title + '.' : currentQuiz().finalTitle) + '</h3>' +
        '<p class="cta-sub">' + escapeHTML(top ? 'Open it to see the tasks, the vibe, and whether it feels right for you.' : currentQuiz().finalSub) + '</p>' +
        '<div class="dual-actions">' +
          (top
            ? '<a id="finalCtaBtn" class="btn primary js-outbound-link" href="' + escapeHTML(top.url) + '" target="_blank" rel="noopener noreferrer" data-role-title="' + escapeHTML(top.title) + '" data-role-rank="1" data-role-url="' + escapeHTML(top.url) + '">' + escapeHTML(currentQuiz().finalButton) + '</a>'
            : '') +
          (second
            ? '<a id="secondCtaBtn" class="btn secondary js-outbound-link" href="' + escapeHTML(second.url) + '" target="_blank" rel="noopener noreferrer" data-role-title="' + escapeHTML(second.title) + '" data-role-rank="2" data-role-url="' + escapeHTML(second.url) + '">' + escapeHTML(currentQuiz().finalSecondaryButton || 'Show option 2') + '</a>'
            : '') +
        '</div>' +
        (top ? '<div class="tiny-note">' + escapeHTML(currentQuiz().finalNote || 'No pressure - open it first and see how it feels.') + '</div>' : '') +
        '<div class="dual-actions" style="margin-top:12px;">' +
          '<button id="restartBtn" class="btn ghost" type="button">Restart</button>' +
        '</div>' +
      '</div>';

    attachOutboundTracking(resultActionArea);

    $('#restartBtn', resultActionArea).addEventListener('click', function() {
      restartFlow();
    });
  }

  function getMailchimpTagForResult(resultInfo) {
    if (!resultInfo || resultInfo.kind !== 'profile') return '';
    const tags = currentQuiz().mailchimpTags || {};
    return tags[resultInfo.animal.id] || '';
  }

  function flattenPayload(payload) {
    const output = {};
    Object.keys(payload || {}).forEach(function(key) {
      const value = payload[key];
      if (value === undefined || value === null) {
        output[key] = '';
      } else if (typeof value === 'object') {
        output[key] = JSON.stringify(value);
      } else {
        output[key] = String(value);
      }
    });
    return output;
  }

  function sheetsEnabled() {
    return !!GOOGLE_SHEETS_WEB_APP_URL && GOOGLE_SHEETS_WEB_APP_URL.indexOf('PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') === -1;
  }

  function sendViaHiddenForm(url, params) {
    const iframeName = 'sheet_log_iframe';
    let iframe = document.getElementById(iframeName);
    if (!iframe) {
      iframe = document.createElement('iframe');
      iframe.id = iframeName;
      iframe.name = iframeName;
      iframe.className = 'hidden';
      document.body.appendChild(iframe);
    }

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = url;
    form.target = iframeName;
    form.className = 'hidden';

    Object.keys(params).forEach(function(key) {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = key;
      input.value = params[key];
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();
    setTimeout(function() {
      try { form.remove(); } catch (error) {}
    }, 1500);
  }

  function logEvent(eventType, payload) {
    if (!sheetsEnabled()) return;

    const params = flattenPayload(Object.assign({
      event_type: eventType,
      timestamp_iso_client: new Date().toISOString()
    }, payload || {}));

    try {
      fetch(GOOGLE_SHEETS_WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: new URLSearchParams(params)
      }).catch(function() {
        sendViaHiddenForm(GOOGLE_SHEETS_WEB_APP_URL, params);
      });
    } catch (error) {
      sendViaHiddenForm(GOOGLE_SHEETS_WEB_APP_URL, params);
    }
  }

  function buildBasePayload(extra) {
    return Object.assign({
      session_id: journey.sessionId,
      quiz_id: currentQuiz().id,
      quiz_title: currentQuiz().title,
      quiz_number: currentQuiz().number,
      flow_stage: !screenResult.classList.contains('hidden') ? 'result' : (!screenEmail.classList.contains('hidden') ? 'email_gate' : (!screenQuestion.classList.contains('hidden') ? 'question' : 'intro')),
      profile_animal: journey.profileResult ? journey.profileResult.animal.id : '',
      profile_energy: journey.profileResult ? journey.profileResult.energy.id : '',
      email: journey.email || '',
      first_name: journey.firstName || '',
      consent: journey.consent ? 'Yes' : 'No',
      page_url: window.location.href,
      referrer: document.referrer || '',
      user_agent: navigator.userAgent || ''
    }, extra || {});
  }

  function buildAnswerPayload(resultInfo) {
    const payload = { answers_json: JSON.stringify(answers) };

    answers.forEach(function(answerKey, index) {
      const selected = getSelectedOption(index, answerKey);
      payload['answer_' + (index + 1) + '_key'] = answerKey || '';
      payload['answer_' + (index + 1) + '_text'] = selected ? selected.text : '';
      payload['answer_' + (index + 1) + '_weights'] = selected ? JSON.stringify(selected.scores || {}) : '';
    });

    if (!resultInfo) return payload;

    if (resultInfo.kind === 'profile') {
      payload.result_key = resultInfo.resultKey;
      payload.primary_animal = resultInfo.animal.id;
      payload.primary_energy = resultInfo.energy.id;
      payload.animal_scores = JSON.stringify(resultInfo.animalScores || {});
      payload.energy_scores = JSON.stringify(resultInfo.energyScores || {});
    } else {
      payload.result_key = resultInfo.resultKey;
      payload.top_tags = (resultInfo.topTags || []).join('|');
      payload.preference_scores = JSON.stringify(resultInfo.preferenceScores || {});
      payload.recommendation_1_title = resultInfo.recommendations[0] ? resultInfo.recommendations[0].title : '';
      payload.recommendation_1_url = resultInfo.recommendations[0] ? resultInfo.recommendations[0].url : '';
      payload.recommendation_2_title = resultInfo.recommendations[1] ? resultInfo.recommendations[1].title : '';
      payload.recommendation_2_url = resultInfo.recommendations[1] ? resultInfo.recommendations[1].url : '';
      payload.primary_family = resultInfo.primaryFamilyId || '';
    }

    return payload;
  }

  function markQuizCompleted(resultInfo) {
    if (journey.completedQuizIds.indexOf(currentQuiz().id) === -1) {
      journey.completedQuizIds.push(currentQuiz().id);
    }

    logEvent('quiz_completed', Object.assign(
      buildBasePayload({
        flow_stage: 'completed',
        result_key: resultInfo ? resultInfo.resultKey : ''
      }),
      buildAnswerPayload(resultInfo)
    ));

    if (resultInfo && resultInfo.kind === 'match') {
      logEvent('recommendations_viewed', Object.assign(buildBasePayload({
        note: 'Viewed internship recommendations'
      }), buildAnswerPayload(resultInfo)));
    }
  }

  function submitMailchimpJSONP(params, timeoutMs) {
    return new Promise(function(resolve, reject) {
      const callbackName = 'mc_cb_' + Math.random().toString(36).slice(2);
      let timedOut = false;
      let cleaned = false;
      const script = document.createElement('script');
      let timer = null;

      function cleanup() {
        if (cleaned) return;
        cleaned = true;
        try { delete window[callbackName]; } catch (error) {}
        try { script.remove(); } catch (error) {}
        if (timer) clearTimeout(timer);
      }

      window[callbackName] = function(response) {
        if (timedOut) return;
        cleanup();
        resolve(response);
      };

      script.src = MAILCHIMP_POST_JSON_URL + '&' + new URLSearchParams(params).toString() + '&c=' + callbackName;
      script.async = true;
      script.onerror = function() {
        cleanup();
        reject(new Error('Network error'));
      };
      document.body.appendChild(script);

      timer = setTimeout(function() {
        timedOut = true;
        cleanup();
        reject(new Error('Timeout'));
      }, timeoutMs || 12000);
    });
  }

  function restartFlow() {
    if (autoTimer) {
      clearTimeout(autoTimer);
      autoTimer = null;
    }

    currentQuizIndex = 0;
    journey.firstName = '';
    journey.email = '';
    journey.consent = false;
    journey.completedQuizIds = [];
    journey.hasSubmittedMailchimp = false;
    journey.finalCtaClicked = false;
    journey.profileResult = null;
    journey.matchResult = null;

    emailInput.value = '';
    consent.checked = false;
    mcFname.value = '';
    mcMsg.textContent = '';
    resultContainer.innerHTML = '';
    resultActionArea.innerHTML = '';

    resetQuizState();
    renderIntro();
  }

  nextBtn.addEventListener('click', function() {
    if (!answers[currentQuestionIndex]) return;
    autoAdvanceOrFinish();
  });

  prevBtn.addEventListener('click', function() {
    if (autoTimer) {
      clearTimeout(autoTimer);
      autoTimer = null;
    }

    if (currentQuestionIndex === 0) {
      renderIntro();
      return;
    }

    loadQuestion(currentQuestionIndex - 1);
  });

  $('#mcForm').addEventListener('submit', async function(event) {
    event.preventDefault();
    mcMsg.className = 'msg muted';
    mcMsg.textContent = '';

    if ((hpInput.value || '').trim() !== '') {
      showResult();
      return;
    }

    const email = (emailInput.value || '').trim();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      mcMsg.className = 'msg error';
      mcMsg.textContent = 'Please enter a valid email address.';
      return;
    }

    if (!consent.checked) {
      mcMsg.className = 'msg error';
      mcMsg.textContent = 'Please tick the consent box to continue.';
      return;
    }

    journey.email = email;
    journey.consent = true;
    journey.firstName = journey.firstName || (mcFname.value || '').trim();

    seeResultsBtn.setAttribute('disabled', 'true');
    mcMsg.textContent = 'Saving...';

    const resultInfo = computeProfileResult();
    const tagId = getMailchimpTagForResult(resultInfo);
    const params = {
      EMAIL: journey.email,
      FNAME: journey.firstName,
      tags: tagId,
      b_44c6260e44554e7b992e09185_083452c971: ''
    };

    try {
      const response = await submitMailchimpJSONP(params, 12000);
      journey.hasSubmittedMailchimp = true;
      if (response && response.result === 'success') {
        mcMsg.className = 'msg success';
        mcMsg.textContent = 'Success! Check your inbox in a few minutes.';
      } else {
        mcMsg.className = 'msg success';
        mcMsg.textContent = 'You may already be subscribed. Showing your result now.';
      }
      logEvent('email_captured', Object.assign(buildBasePayload({ note: 'Email captured at gate', result_key: resultInfo.resultKey }), { email: journey.email, consent: 'Yes' }));
      showResult();
    } catch (error) {
      try {
        fbEmail.value = journey.email;
        fbFname.value = journey.firstName;
        fbTags.value = tagId;
        fbHp.value = '';
        fbForm.submit();
      } catch (fallbackError) {}

      journey.hasSubmittedMailchimp = true;
      logEvent('email_captured', Object.assign(buildBasePayload({ note: 'Email captured via fallback path', result_key: resultInfo.resultKey }), { email: journey.email, consent: 'Yes' }));
      mcMsg.className = 'msg muted';
      mcMsg.textContent = 'Connection was spotty — proceeding anyway.';
      setTimeout(function() {
        showResult();
      }, 900);
    } finally {
      seeResultsBtn.removeAttribute('disabled');
    }
  });

  resetQuizState();
  renderIntro();
})();
</script>
